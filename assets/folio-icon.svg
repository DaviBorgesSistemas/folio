<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Folio">
  <defs>
    <!-- fundo: azul-violeta da paleta, do claro (topo) ao profundo (base) -->
    <linearGradient id="fo-bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#DADCFF"/>
      <stop offset="0.55" stop-color="#8E94FA"/>
      <stop offset="1" stop-color="#5A60E6"/>
    </linearGradient>
    <!-- brilho suave no canto superior esquerdo -->
    <radialGradient id="fo-glow" cx="0.22" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.60"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- montanhas da foto da frente -->
    <linearGradient id="fo-m-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E94FA"/>
      <stop offset="1" stop-color="#6A71F0"/>
    </linearGradient>
    <linearGradient id="fo-m-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3F44B8"/>
      <stop offset="1" stop-color="#272A78"/>
    </linearGradient>
    <linearGradient id="fo-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F5FF"/>
      <stop offset="1" stop-color="#DDE0FF"/>
    </linearGradient>
    <linearGradient id="fo-sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC18A"/>
      <stop offset="1" stop-color="#FF8F7A"/>
    </linearGradient>
    <clipPath id="fo-photo"><rect x="140" y="146" width="232" height="232" rx="48"/></clipPath>
    <filter id="fo-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1B1E6B" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- fundo do ícone -->
  <rect width="512" height="512" rx="116" fill="url(#fo-bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#fo-glow)"/>

  <!-- cartões de trás, em leque (as "pastas" de fotos) -->
  <g transform="rotate(-17 256 262)">
    <rect x="144" y="124" width="224" height="244" rx="46" fill="#FFFFFF" fill-opacity="0.30"/>
  </g>
  <g transform="rotate(11 256 262)">
    <rect x="144" y="132" width="224" height="244" rx="46" fill="#FFFFFF" fill-opacity="0.55"/>
  </g>

  <!-- foto da frente -->
  <g filter="url(#fo-shadow)">
    <rect x="140" y="146" width="232" height="232" rx="48" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#fo-photo)">
    <rect x="140" y="146" width="232" height="232" fill="url(#fo-sky)"/>
    <circle cx="318" cy="208" r="23" fill="url(#fo-sun)"/>
    <path d="M140 338 L226 236 L300 322 L336 284 L372 322 L372 378 L140 378 Z" fill="url(#fo-m-far)"/>
    <path d="M140 378 L140 350 L208 288 L268 350 L314 306 L372 360 L372 378 Z" fill="url(#fo-m-near)"/>
  </g>
  <!-- fio de luz na borda da foto -->
  <rect x="141" y="147" width="230" height="230" rx="47" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2"/>
</svg>

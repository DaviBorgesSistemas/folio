<script>
  (function() {
    const sheet = document.getElementById('infoBottomSheet');
    const backdrop = document.getElementById('sheetBackdrop');
    const okBtn = document.getElementById('primaryOkBtn');
    const closeBtn = document.getElementById('closeIconBtn');

    function dismissSheet() {
      if (!sheet || !backdrop) return;
      sheet.style.transform = 'translateY(100%)';
      sheet.style.transition = 'transform 0.28s cubic-bezier(0.32, 0.72, 0, 1)';
      backdrop.style.opacity = '0';
      backdrop.style.pointerEvents = 'none';
      setTimeout(() => {
        sheet.style.display = 'none';
      }, 300);
    }

    if (okBtn) okBtn.addEventListener('click', dismissSheet);
    if (closeBtn) closeBtn.addEventListener('click', dismissSheet);
    if (backdrop) backdrop.addEventListener('click', dismissSheet);
  })();
</script></main></body></html>

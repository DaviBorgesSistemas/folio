<!DOCTYPE html><html lang="pt-BR"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Folio — Visualizador (Normal)</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">/** @type {import('tailwindcss').Config} */

globalThis.tailwind.config = {

  theme: {

        'background': '#121318',
        'on-background': '#E3E1E9',
        'stage': '#0A0A0B',
        'page-frame': '#07070A',
        'surface': '#1E1F25',
        'on-surface': '#E3E1E9',

        'on-primary': '#272A78',

        'danger': '#FFB4AB',
        'on-danger': '#690005',
        'snackbar': '#E3E1E9',

        'snackbar-action': '#E0E0FF',
        'on-snackbar-action': '#3B3E8F',
      },
      borderRadius: {
        'tile': '12px',
        'chip': '12px',
        'segmented': '20px',
        'cover': '20px',
        'fab': '20px',
        'menu': '24px',
        'card': '28px',
        'bar': '28px',
        'button': '28px',
        'dialog': '28px',
        'sheet-top': '28px',
        'full': '9999px',
      },
      spacing: {
        'collage-gap': '2px',
        'grid-photo-gap': '4px',

        'screen-photo-x': '8px',
        'card-pad': '8px',
        'card-pad-bottom': '12px',
        'bar-margin': '14px',
        'chip-pad-x': '16px',
        'dialog-pad': '24px',
        'sheet-pad-y': '28px',
      },
      fontFamily: {
        'display': ['"Plus Jakarta Sans"', 'sans-serif'],
        'title': ['"Plus Jakarta Sans"', 'sans-serif'],
        'button': ['"Plus Jakarta Sans"', 'sans-serif'],
        'label': ['"Plus Jakarta Sans"', 'sans-serif'],
        'body': ['"Plus Jakarta Sans"', 'sans-serif'],
        'caption': ['"Plus Jakarta Sans"', 'sans-serif'],
      },
      fontSize: {
        'display-num': ['64px', { lineHeight: '72px', letterSpacing: '-1.92px', fontWeight: '800' }],
        'display-num-mobile': ['32px', { lineHeight: '38px', letterSpacing: '-0.96px', fontWeight: '800' }],
        'screen-title': ['34px', { lineHeight: '40px', letterSpacing: '-1.19px', fontWeight: '800' }],
        'screen-title-mobile': ['32px', { lineHeight: '38px', letterSpacing: '-1.12px', fontWeight: '800' }],
        'dialog-title': ['22px', { lineHeight: '28px', letterSpacing: '-0.44px', fontWeight: '800' }],
        'topbar-title': ['20px', { lineHeight: '26px', letterSpacing: '-0.2px', fontWeight: '700' }],
        'button-lg': ['17px', { lineHeight: '22px', letterSpacing: '0px', fontWeight: '700' }],
        'title-md': ['16px', { lineHeight: '22px', letterSpacing: '0px', fontWeight: '700' }],

        'button-ghost': ['15px', { lineHeight: '20px', letterSpacing: '0px', fontWeight: '600' }],

        'label-md': ['13px', { lineHeight: '18px', letterSpacing: '0px', fontWeight: '600' }],
        'caption-sm': ['13px', { lineHeight: '18px', letterSpacing: '0px', fontWeight: '400' }],
      },
      transitionDuration: {
        'state-change': '100ms',
        'surface-enter': '250ms',
        'surface-exit': '150ms',
      },
      transitionDelay: {
        'state-change': '0ms',
        'surface-enter': '0ms',
        'surface-exit': '0ms',
      },
      transitionTimingFunction: {
        'state-change': 'ease-out',
        'surface-enter': 'cubic-bezier(0.2, 0, 0, 1)',

if (typeof module !== 'undefined') module.exports = globalThis.tailwind.config;
</script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@24,300..700,0..1&amp;display=block" rel="stylesheet">
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      display: inline-block; width: 1em; height: 1em; line-height: 1 !important;
      box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle;
    }

    .viewer-topbar {
      height: 72px;
      background: linear-gradient(180deg, rgba(10, 10, 11, 0.80) 0%, rgba(10, 10, 11, 0) 100%);
    }

    .strong-glass-btn {
      background: rgba(34, 35, 44, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(22px) saturate(1.5);
      -webkit-backdrop-filter: blur(22px) saturate(1.5);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .strong-glass-bar {
      left: 14px;
      right: 14px;
      bottom: 14px;
      height: 68px;
      background: rgba(34, 35, 44, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(22px) saturate(1.5);
      -webkit-backdrop-filter: blur(22px) saturate(1.5);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .bar-label-xs {
      font-size: 11px;
      font-weight: 500;
      line-height: 14px;
    }

    .sunset-stage-photo {
      aspect-ratio: 16 / 9;
      background: linear-gradient(180deg, #ffd7ba 0%, #ff9b85 45%, #c95d7a 75%, #46234d 100%);
    }
  </style>
</head>
<body class="bg-stage text-on-surface font-body antialiased selection:bg-secondary-container selection:text-on-secondary-container">
  <div class="bg-stage relative min-h-[884px] w-full overflow-hidden flex items-center justify-center" data-stitch-vh="min-h-[884px]===min-h-screen">
    <!-- Centered 16:9 stylized sunset landscape photo -->
    <figure class="sunset-stage-photo w-full relative overflow-hidden" aria-label="Foto em visualização">
      <svg class="w-full h-full block" viewBox="0 0 390 220" preserveAspectRatio="xMidYMid slice" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="skyA" x1="0" y1="0" x2="0" y2="220" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFE0C2"></stop>
            <stop offset="48%" stop-color="#FF9580"></stop>
            <stop offset="100%" stop-color="#8A3E6B"></stop>
          </linearGradient>
        </defs>
        <rect width="390" height="220" fill="url(#skyA)"></rect>
        <!-- Pale sun -->
        <circle cx="282" cy="74" r="24" fill="#FFF3E0" fill-opacity="0.92"></circle>
        <circle cx="282" cy="74" r="40" fill="#FFE0C2" fill-opacity="0.25"></circle>
        <!-- Layered purple hills -->
        <path d="M0 156 Q80 116 172 146 T390 132 L390 220 L0 220 Z" fill="#6D3B78" fill-opacity="0.88"></path>
        <path d="M0 176 Q115 144 218 168 T390 158 L390 220 L0 220 Z" fill="#462252"></path>
        <path d="M0 194 Q140 175 260 192 T390 182 L390 220 L0 220 Z" fill="#281136"></path>
      </svg>
    </figure>

    <!-- Overlaid Top Bar (72px) -->
    <header class="viewer-topbar absolute top-0 inset-x-0 px-2 flex items-center justify-between gap-2 z-20">
      <div class="flex items-center gap-2 min-w-0">
        <!-- COMPONENT: button-icon -->
        <button data-component-id="button-icon" data-component-type="button" data-component-variant="icon" type="button" aria-label="Voltar" class="w-11 h-11 rounded-full bg-transparent text-on-surface flex items-center justify-center shrink-0 hover:bg-white/10">
          <span class="material-symbols-outlined text-[24px]" aria-hidden="true">arrow_back</span>
        </button>
        <div class="flex flex-col min-w-0">
          <h1 class="font-title text-topbar-title text-on-surface truncate" data-design-text-token="topbar-title">Hoje 14:32</h1>
          <span class="font-caption text-caption-sm text-on-surface-muted tabular-nums" data-design-text-token="caption-sm">3 de 48</span>
        </div>
      </div>

      <div class="flex items-center gap-1 shrink-0">
        <!-- COMPONENT: button-icon -->
        <button data-component-id="button-icon" data-component-type="button" data-component-variant="icon" type="button" aria-label="Favoritar" class="w-11 h-11 rounded-full bg-transparent text-on-surface flex items-center justify-center hover:bg-white/10">
          <span class="material-symbols-outlined text-[24px]" aria-hidden="true">favorite</span>
        </button>
        <!-- COMPONENT: button-icon -->
        <button data-component-id="button-icon" data-component-type="button" data-component-variant="icon" type="button" aria-label="Informações" class="w-11 h-11 rounded-full bg-transparent text-on-surface flex items-center justify-center hover:bg-white/10">
          <span class="material-symbols-outlined text-[24px]" aria-hidden="true">info</span>
        </button>
      </div>
    </header>

    <!-- Left & Right 44px frosted-glass navigation arrows -->
    <button type="button" aria-label="Foto anterior" class="strong-glass-btn w-11 h-11 rounded-full text-on-surface flex items-center justify-center absolute left-2 top-1/2 -translate-y-1/2 z-20">
      <span class="material-symbols-outlined text-[24px]" aria-hidden="true">arrow_back</span>
    </button>
    <button type="button" aria-label="Próxima foto" class="strong-glass-btn w-11 h-11 rounded-full text-on-surface flex items-center justify-center absolute right-2 top-1/2 -translate-y-1/2 z-20">
      <span class="material-symbols-outlined text-[24px]" aria-hidden="true">arrow_forward</span>
    </button>

    <!-- Bottom floating strong-glass action bar (5 equal columns) -->
    <!-- COMPONENT: modal-floating-bar -->
    <nav aria-label="Ações da foto" data-component-id="modal-floating-bar" data-component-type="modal" data-component-variant="standard" class="strong-glass-bar fixed rounded-bar grid grid-cols-5 items-center z-20">
      <button type="button" class="h-full flex flex-col items-center justify-center gap-1 text-on-surface hover:bg-white/5 rounded-l-bar">
        <span class="material-symbols-outlined text-[22px]" aria-hidden="true">share</span>
        <span class="bar-label-xs font-label" data-design-text-token="label-md">Compartilhar</span>
      </button>
      <button type="button" class="h-full flex flex-col items-center justify-center gap-1 text-on-surface hover:bg-white/5">
        <span class="material-symbols-outlined text-[22px]" aria-hidden="true">lock</span>
        <span class="bar-label-xs font-label" data-design-text-token="label-md">Bloquear</span>
      </button>
      <button type="button" class="h-full flex flex-col items-center justify-center gap-1 text-danger hover:bg-white/5">
        <span class="material-symbols-outlined text-[22px]" aria-hidden="true">delete</span>
        <span class="bar-label-xs font-label" data-design-text-token="label-md">Excluir</span>
      </button>
      <button type="button" class="h-full flex flex-col items-center justify-center gap-1 text-on-surface hover:bg-white/5">
        <span class="material-symbols-outlined text-[22px]" aria-hidden="true">auto_fix_high</span>
        <span class="bar-label-xs font-label" data-design-text-token="label-md">Editar</span>
      </button>
      <button type="button" class="h-full flex flex-col items-center justify-center gap-1 text-on-surface hover:bg-white/5 rounded-r-bar">
        <span class="material-symbols-outlined text-[22px]" aria-hidden="true">more_vert</span>
        <span class="bar-label-xs font-label" data-design-text-token="label-md">Mais</span>
      </button>
    </nav>
  </div>


</body></html>

<script>
  (function() {
    const clearBtn = document.getElementById('btn-clear-query');
    const cancelBtn = document.getElementById('btn-cancel-search');
    const fabBtn = document.getElementById('btn-fab-new');

    if (clearBtn) {
      clearBtn.addEventListener('click', function() {
        const textNode = this.parentElement.querySelector('.text-on-surface');
        if (textNode) {
          textNode.textContent = '';
        }
      });
    }

    if (cancelBtn) {
      cancelBtn.addEventListener('click', function() {
        const textNode = document.querySelector('#btn-clear-query')?.parentElement.querySelector('.text-on-surface');
        if (textNode) {
          textNode.textContent = '';
        }
      });
    }

    if (fabBtn) {
      fabBtn.addEventListener('click', function() {
        this.classList.add('scale-90');
        setTimeout(() => this.classList.remove('scale-90'), 150);
      });
    }
  })();

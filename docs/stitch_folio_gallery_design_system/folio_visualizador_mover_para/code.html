</div>

</div>
<div class="flex items-center space-x-space-xs shrink-0">
<span class="font-label-sm text-label-sm text-on-surface-variant">187</span>
<span class="material-symbols-outlined text-[16px] text-outline opacity-40">chevron_right</span>
</div>
</button>
<!-- 3. Ux -->
<button class="folder-row group flex items-center justify-between w-full h-[58px] text-left transition-colors active:bg-surface-container-high/40 rounded-xl px-space-xs" type="button">
<div class="flex items-center space-x-space-md min-w-0">
<div class="w-[38px] h-[38px] rounded-xl bg-primary-container/20 flex items-center justify-center text-primary-container shrink-0 group-active:scale-95 transition-transform">

</button>
<!-- 4. Pins -->
<button class="folder-row group flex items-center justify-between w-full h-[58px] text-left transition-colors active:bg-surface-container-high/40 rounded-xl px-space-xs" type="button">

<div class="flex items-center space-x-space-md min-w-0">
<div class="w-[38px] h-[38px] rounded-xl bg-primary-container/20 flex items-center justify-center text-primary-container shrink-0 group-active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px]">download</span>
</div>

</div>
<div class="flex items-center space-x-space-xs shrink-0">

</div>
</button>
<!-- 6. Thing -->
<button class="folder-row group flex items-center justify-between w-full h-[58px] text-left transition-colors active:bg-surface-container-high/40 rounded-xl px-space-xs" type="button">
<div class="flex items-center space-x-space-md min-w-0">

</div>

</button>

      </button>
</div>
<!-- Interactive Feedback Toast (Delight Confirmation) -->
<div class="hidden absolute bottom-6 inset-x-6 h-[48px] bg-on-surface text-surface rounded-full flex items-center justify-between px-space-lg shadow-xl z-30 transition-all duration-300" id="feedback-toast">
<div class="flex items-center space-x-space-sm">
<span class="material-symbols-outlined text-primary-container text-[20px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-md text-label-md text-[#121318]" id="toast-text">Movendo foto...</span>
</div>
<button class="font-label-md text-label-md text-[#272a78] active:opacity-75" type="button">Desfazer</button>
</div>
</div>
</div>
<script>
  (function () {
    const rows = document.querySelectorAll('.folder-row');
    const toast = document.getElementById('feedback-toast');
    const toastText = document.getElementById('toast-text');
    const closeBtn = document.getElementById('close-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const newAlbumBtn = document.getElementById('new-album-btn');

    rows.forEach((row) => {
      row.addEventListener('click', () => {
        const folderName = row.querySelector('.font-title-sm')?.textContent || 'destino';
        if (toast && toastText) {
          toastText.textContent = `Movido para ${folderName}`;
          toast.classList.remove('hidden');
          toast.classList.add('flex');
          setTimeout(() => {
            toast.classList.add('hidden');
            toast.classList.remove('flex');
          }, 2400);
        }
      });
    });

    [closeBtn, cancelBtn].forEach((btn) => {
      if (btn) {
        btn.addEventListener('click', () => {
          if (toast && toastText) {
            toastText.textContent = 'Operação cancelada';
            toast.classList.remove('hidden');
            toast.classList.add('flex');
            setTimeout(() => {
              toast.classList.add('hidden');
              toast.classList.remove('flex');
            }, 1500);
          }
        });
      }
    });

    if (newAlbumBtn) {
      newAlbumBtn.addEventListener('click', () => {
        if (toast && toastText) {
          toastText.textContent = 'Criar novo álbum...';
          toast.classList.remove('hidden');
          toast.classList.add('flex');
          setTimeout(() => {
            toast.classList.add('hidden');
            toast.classList.remove('flex');
          }, 1800);
        }
      });
    }
  })();

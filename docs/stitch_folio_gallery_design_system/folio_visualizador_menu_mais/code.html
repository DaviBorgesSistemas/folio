  </head><body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col"><main class="flex flex-col relative w-full min-h-screen bg-surface"><div class="flex flex-col w-full relative select-none overflow-hidden" style="height: 844px; max-height: 844px; background-color: #0A0A0B;">
<!-- Stage Backdrop / Media Presentation Canvas -->
<div class="absolute inset-0 flex items-center justify-center overflow-hidden">
<!-- Chromatic Atmospheric Glow for Glass Refraction (subtle behind image) -->
<div class="absolute w-[360px] h-[260px] rounded-full blur-[100px] pointer-events-none opacity-20 bg-primary-container"></div>
<!-- Stylized 16:9 Sunset Landscape Contained -->

</div>
</div>
<!-- Subtle Dim Scrim Layer for Open Context Menu Focus -->
<div class="absolute inset-0 bg-surface-container-lowest/40 backdrop-blur-[2px] z-10 transition-opacity duration-300" id="backdrop-scrim"></div>
<!-- Top Bar (72px Overlay with Smooth Falloff Gradient) -->
<header class="absolute top-0 left-0 right-0 h-[72px] z-20 flex items-center justify-between px-space-md bg-gradient-to-b from-[#0A0A0B]/90 via-[#0A0A0B]/50 to-transparent pointer-events-auto">
<!-- Back Button -->
<button aria-label="Voltar para a grade" class="w-[44px] h-[44px] rounded-full flex items-center justify-center bg-surface-container-high/60 backdrop-blur-md text-on-surface hover:bg-surface-container-highest active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<!-- Center Timestamp & Index Counter -->
<div class="flex flex-col items-center justify-center pointer-events-none">
<span class="font-headline-sm text-headline-sm text-on-surface tracking-tight leading-none mb-1">Hoje, 14:32</span>
<span class="font-label-sm text-label-sm text-on-surface-variant leading-none">3 de 48</span>
</div>
<!-- Actions (Heart & Info) -->
<div class="flex items-center gap-space-xs">
<button aria-label="Favoritar foto" class="w-[44px] h-[44px] rounded-full flex items-center justify-center bg-surface-container-high/60 backdrop-blur-md text-on-surface hover:text-tertiary-container hover:bg-surface-container-highest active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[24px]">favorite</span>
</button>
<button aria-label="Detalhes da foto" class="w-[44px] h-[44px] rounded-full flex items-center justify-center bg-surface-container-high/60 backdrop-blur-md text-on-surface hover:bg-surface-container-highest active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[24px]">info</span>
</button>
</div>
</header>
<!-- Center Navigation Arrows (44px Frosted Glass Pills at Margins) -->
<div class="absolute inset-y-0 left-0 right-0 flex items-center justify-between px-2 pointer-events-none z-20">
<button aria-label="Foto anterior" class="pointer-events-auto w-[44px] h-[44px] rounded-full flex items-center justify-center bg-surface-container-highest/70 backdrop-blur-xl text-on-surface hover:bg-surface-bright active:scale-90 transition-transform shadow-lg" type="button">
<span class="material-symbols-outlined text-[24px]">chevron_left</span>
</button>
<button aria-label="Próxima foto" class="pointer-events-auto w-[44px] h-[44px] rounded-full flex items-center justify-center bg-surface-container-highest/70 backdrop-blur-xl text-on-surface hover:bg-surface-bright active:scale-90 transition-transform shadow-lg" type="button">
<span class="material-symbols-outlined text-[24px]">chevron_right</span>
</button>
</div>
<!-- 'Mais' Glass Menu (Frame B - Open State: 236px wide, Elevated Strong Glass) -->
<div aria-labelledby="btn-mais" aria-orientation="vertical" class="absolute right-[16px] bottom-[96px] w-[236px] rounded-[24px] z-30 p-[8px] flex flex-col shadow-2xl backdrop-blur-2xl bg-surface-container-high/90 overflow-hidden transform transition-all duration-200" id="menu-mais" role="menu">
<!-- Item 1: Renomear -->
<button class="w-full h-[40px] px-[12px] flex items-center gap-[12px] rounded-[16px] hover:bg-surface-container-highest/80 active:bg-surface-bright text-on-surface transition-colors" role="menuitem" type="button">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant flex-shrink-0">edit</span>
<span class="font-body-md text-body-md truncate">Renomear</span>
</button>
<!-- Item 2: Slideshow -->
<button class="w-full h-[40px] px-[12px] flex items-center gap-[12px] rounded-[16px] hover:bg-surface-container-highest/80 active:bg-surface-bright text-on-surface transition-colors" role="menuitem" type="button">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant flex-shrink-0">slideshow</span>
<span class="font-body-md text-body-md truncate">Apresentação</span>
</button>
<!-- Item 3: Copiar para -->
<button class="w-full h-[40px] px-[12px] flex items-center gap-[12px] rounded-[16px] hover:bg-surface-container-highest/80 active:bg-surface-bright text-on-surface transition-colors" role="menuitem" type="button">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant flex-shrink-0">file_copy</span>
<span class="font-body-md text-body-md truncate">Copiar para</span>
</button>
<!-- Item 4: Mover para -->
<button class="w-full h-[40px] px-[12px] flex items-center gap-[12px] rounded-[16px] hover:bg-surface-container-highest/80 active:bg-surface-bright text-on-surface transition-colors" role="menuitem" type="button">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant flex-shrink-0">drive_file_move</span>
<span class="font-body-md text-body-md truncate">Mover para</span>
</button>
<!-- Item 5: Abrir com -->
<button class="w-full h-[40px] px-[12px] flex items-center gap-[12px] rounded-[16px] hover:bg-surface-container-highest/80 active:bg-surface-bright text-on-surface transition-colors" role="menuitem" type="button">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant flex-shrink-0">open_in_new</span>
<span class="font-body-md text-body-md truncate">Abrir com</span>
</button>
<!-- Item 6: Imprimir -->
<button class="w-full h-[40px] px-[12px] flex items-center gap-[12px] rounded-[16px] hover:bg-surface-container-highest/80 active:bg-surface-bright text-on-surface transition-colors" role="menuitem" type="button">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant flex-shrink-0">print</span>
<span class="font-body-md text-body-md truncate">Imprimir</span>
</button>
<!-- Item 7: Definir como -->
<button class="w-full h-[40px] px-[12px] flex items-center gap-[12px] rounded-[16px] hover:bg-surface-container-highest/80 active:bg-surface-bright text-on-surface transition-colors" role="menuitem" type="button">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant flex-shrink-0">wallpaper</span>
<span class="font-body-md text-body-md truncate">Definir como</span>
</button>
</div>
<!-- Floating Bottom Action Dock (68px Detached Chrome, 5 Columns) -->
<div class="absolute bottom-[20px] left-0 right-0 px-[14px] z-30">
<nav class="w-full h-[68px] rounded-[28px] bg-surface-container-high/80 backdrop-blur-2xl px-2 flex items-center justify-around shadow-2xl">
<!-- 1. Compartilhar -->
<button class="flex flex-col items-center justify-center w-[54px] h-[54px] rounded-full text-on-surface-variant hover:text-on-surface hover:bg-surface-container-highest/50 active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[22px]">share</span>
<span class="font-label-sm text-[10px] leading-tight mt-1 text-on-surface-variant">Compartilhar</span>
</button>
<!-- 2. Bloquear / Cofre -->
<button class="flex flex-col items-center justify-center w-[54px] h-[54px] rounded-full text-on-surface-variant hover:text-on-surface hover:bg-surface-container-highest/50 active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[22px]">lock</span>
<span class="font-label-sm text-[10px] leading-tight mt-1 text-on-surface-variant">Ocultar</span>
</button>
<!-- 3. Excluir (Destructive Action Hue) -->
<button class="flex flex-col items-center justify-center w-[54px] h-[54px] rounded-full text-tertiary-fixed-dim hover:text-error hover:bg-surface-container-highest/50 active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[22px]">delete</span>
<span class="font-label-sm text-[10px] leading-tight mt-1 text-tertiary-fixed-dim">Excluir</span>
</button>
<!-- 4. Editar -->
<button class="flex flex-col items-center justify-center w-[54px] h-[54px] rounded-full text-on-surface-variant hover:text-on-surface hover:bg-surface-container-highest/50 active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[22px]">tune</span>
<span class="font-label-sm text-[10px] leading-tight mt-1 text-on-surface-variant">Editar</span>
</button>
<!-- 5. Mais (Active & Highlighted in Frame B) -->
<button aria-expanded="true" class="flex flex-col items-center justify-center w-[54px] h-[54px] rounded-[22px] bg-secondary-container text-primary font-bold shadow-md active:scale-95 transition-all" id="btn-mais" type="button">
<span class="material-symbols-outlined text-[22px]">more_vert</span>
<span class="font-label-sm text-[10px] leading-tight mt-1 text-primary">Mais</span>
</button>
</nav>
</div>
<script>
    (function() {
      const scrim = document.getElementById('backdrop-scrim');
      const menu = document.getElementById('menu-mais');
      const btnMais = document.getElementById('btn-mais');

      let isOpen = true;

      function toggleMenu() {
        isOpen = !isOpen;
        if (isOpen) {
          menu.classList.remove('opacity-0', 'pointer-events-none', 'scale-95');
          menu.classList.add('opacity-100', 'pointer-events-auto', 'scale-100');
          scrim.classList.remove('opacity-0', 'pointer-events-none');
          scrim.classList.add('opacity-100', 'pointer-events-auto');
          btnMais.classList.add('bg-secondary-container', 'text-primary');
          btnMais.classList.remove('text-on-surface-variant');
        } else {
          menu.classList.add('opacity-0', 'pointer-events-none', 'scale-95');
          menu.classList.remove('opacity-100', 'pointer-events-auto', 'scale-100');
          scrim.classList.add('opacity-0', 'pointer-events-none');
          scrim.classList.remove('opacity-100', 'pointer-events-auto');
          btnMais.classList.remove('bg-secondary-container', 'text-primary');
          btnMais.classList.add('text-on-surface-variant');
        }
        btnMais.setAttribute('aria-expanded', String(isOpen));
      }

      if (scrim && btnMais && menu) {
        scrim.addEventListener('click', toggleMenu);
        btnMais.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleMenu();
        });
      }
    })();
  </script>

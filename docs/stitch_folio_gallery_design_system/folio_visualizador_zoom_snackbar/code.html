  </head><body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col"><main class="flex flex-col relative w-full min-h-screen bg-surface"><div class="flex flex-col w-full relative select-none overflow-hidden pb-safe">
<!-- Optical Ambient Gradient Glows (Canvas backdrop) -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute -top-32 -left-20 w-80 h-80 rounded-full bg-primary-container/10 blur-3xl"></div>
<div class="absolute top-1/2 -right-32 w-96 h-96 rounded-full bg-on-tertiary-container/15 blur-3xl"></div>
<div class="absolute -bottom-20 left-10 w-72 h-72 rounded-full bg-secondary-container/20 blur-3xl"></div>
</div>
<!-- Primary Viewer Stage: Deep Obsidian Surface (0A0A0B) -->
<div class="relative w-full overflow-hidden bg-surface-container-lowest rounded-3xl" style="height: 740px;">
<!-- Zoomed Stage Photo Canvas (Magnified 2.5x with dynamic pan focus) -->
<div class="absolute inset-0 overflow-hidden cursor-grab active:cursor-grabbing transition-transform duration-300 ease-out" id="zoom-stage">
<div class="w-full h-full bg-cover bg-center origin-center transition-all duration-500 ease-out" data-alt="Ultra high-resolution dynamic telephoto crop of an ethereal sunset landscape. Magnified details highlight subtle atmospheric haze, a warm peach-to-coral luminous gradient in the western horizon, soft pale sun disk, and deeply layered textured violet hills with velvety silhouettes, subtle cinematic fog, and refined natural grain." id="zoomed-media" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBYzXOyFxA6xo-kN9_vUb1qhp8Gno6H6Ni0OnK38UXmY8NcvSicz1Zcaeiws5h6ZQ4lP_hmtb9vL2lyukZkviQglx56HQPtDAmRDCyKwiHuMZAW-pV2veC-vopZXrlIhy40Rzrx5PPy0fh7p62qwGRpz5kkSTNtVUR9o9P2KrAhKa2FWn6K2TeP0ydWon4-ZiFfPuy6413pSefGUIbKdrOCj1_EgX3xfM0CXtc2XrU'); transform: scale(2.45) translate(-4%, 2%);">
</div>
</div>
<!-- Scrim Overlays for Superior Floating Chrome Contrast -->
<div class="absolute top-0 inset-x-0 h-32 bg-gradient-to-b from-surface-container-lowest/80 via-surface-container-lowest/40 to-transparent pointer-events-none z-10"></div>
<div class="absolute bottom-0 inset-x-0 h-44 bg-gradient-to-t from-surface-container-lowest/90 via-surface-container-lowest/50 to-transparent pointer-events-none z-10"></div>
<!-- Magnification & Zoom Status Tag (Moments of Delight: Micro-feedback HUD) -->
<div class="absolute top-20 right-4 z-20 flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-highest/60 backdrop-blur-md shadow-sm">
<span class="material-symbols-outlined text-primary text-xs" style="font-size: 14px;">zoom_in</span>
<span class="font-label-sm text-label-sm text-primary tracking-wide">2.5×</span>
</div>
<!-- Floating Top App Bar (72px, Glassmorphic translucent capsule) -->
<header class="absolute top-2 inset-x-3.5 h-[72px] rounded-3xl bg-surface-container-high/65 backdrop-blur-xl shadow-lg flex items-center justify-between px-2.5 z-30">
<!-- Back / Exit Zoom Button -->
<button aria-label="Voltar para a grade" class="w-11 h-11 rounded-full flex items-center justify-center text-on-surface bg-surface-bright/40 active:bg-surface-bright transition-transform active:scale-95" id="btn-back">
<span class="material-symbols-outlined text-on-surface" style="font-size: 24px;">arrow_back</span>
</button>
<!-- Contextual Metadata: Date & Sequence Counter -->
<div class="flex flex-col items-center justify-center text-center">
<h1 class="font-title-sm text-title-sm text-on-surface tracking-tight">Hoje, 14:32</h1>
<span class="font-label-sm text-label-sm text-on-surface-variant">3 de 48</span>
</div>
<!-- Action Cluster: Favorite Heart & Info Sheet -->
<div class="flex items-center gap-1">
<button aria-label="Favoritar foto" class="w-11 h-11 rounded-full flex items-center justify-center text-on-surface hover:text-tertiary-fixed active:bg-surface-bright/50 transition-colors" id="btn-fav">
<span class="material-symbols-outlined text-tertiary" id="fav-icon" style="font-size: 22px; font-variation-settings: 'FILL' 1;">favorite</span>
</button>
<button aria-label="Detalhes e metadados EXIF" class="w-11 h-11 rounded-full flex items-center justify-center text-on-surface active:bg-surface-bright/50 transition-colors" id="btn-info">
<span class="material-symbols-outlined text-on-surface-variant" style="font-size: 22px;">info</span>
</button>
</div>
</header>
<!-- Context Notice / Subtle Quick Gesture Toast Hint -->
<div class="absolute bottom-40 inset-x-0 flex justify-center pointer-events-none z-20">
<div class="px-3.5 py-1.5 rounded-full bg-surface-container-high/40 backdrop-blur-md flex items-center gap-2 text-on-surface-variant/80 shadow-sm animate-pulse">
<span class="material-symbols-outlined text-sm" style="font-size: 15px;">pinch</span>
<span class="font-label-sm text-label-sm">Toque duas vezes para redefinir zoom</span>
</div>
</div>
<!-- Floating Delete Snackbar Pill (Material Design 3 Variation) -->
<!-- Positioned precisely ~88px above base, centered, with 16px lateral margins -->
<aside aria-live="polite" class="absolute bottom-[92px] inset-x-4 h-12 bg-on-surface rounded-full shadow-2xl flex items-center justify-between pl-4 pr-1.5 z-40 transition-all duration-300 transform translate-y-0 opacity-100" id="snackbar-delete" role="status">
<div class="flex items-center gap-2.5 min-w-0 pr-2">
<span class="material-symbols-outlined text-surface-container-lowest" style="font-size: 20px;">delete</span>
<span class="font-label-md text-label-md text-surface-container-lowest truncate">Imagem excluída</span>
</div>
<!-- Undo Action Button -->
<button class="h-9 px-3.5 rounded-full bg-primary-container/40 hover:bg-primary-container/60 active:scale-95 transition-transform flex items-center justify-center" id="btn-undo" type="button">
<span class="font-label-md text-label-md text-on-primary-container">Desfazer</span>
</button>
</aside>
<!-- Floating Bottom Action Dock (68px, 28px radius, detached 14px lateral margin) -->
<nav aria-label="Barra de ações da foto" class="absolute bottom-3.5 inset-x-3.5 h-[68px] rounded-[28px] bg-surface-container-high/70 backdrop-blur-2xl shadow-2xl flex items-center justify-between px-2 z-30">
<!-- Action 1: Compartilhar -->
<button class="flex-1 flex flex-col items-center justify-center gap-0.5 py-1 rounded-2xl text-on-surface-variant hover:text-on-surface active:bg-surface-bright/30 transition-all" type="button">
<span class="material-symbols-outlined" style="font-size: 22px;">ios_share</span>
<span class="font-label-sm text-label-sm tracking-tight text-on-surface-variant">Compartilhar</span>
</button>
<!-- Action 2: Bloquear / Cofre Privado -->
<button class="flex-1 flex flex-col items-center justify-center gap-0.5 py-1 rounded-2xl text-on-surface-variant hover:text-on-surface active:bg-surface-bright/30 transition-all" type="button">
<span class="material-symbols-outlined" style="font-size: 22px;">lock</span>
<span class="font-label-sm text-label-sm tracking-tight text-on-surface-variant">Bloquear</span>
</button>
<!-- Action 3: Excluir (Contextually Triggered) -->
<button class="flex-1 flex flex-col items-center justify-center gap-0.5 py-1 rounded-2xl text-tertiary-fixed-dim hover:text-tertiary active:bg-surface-bright/30 transition-all" id="btn-delete" type="button">
<span class="material-symbols-outlined text-tertiary-fixed-dim" style="font-size: 22px;">delete_outline</span>
<span class="font-label-sm text-label-sm tracking-tight text-tertiary-fixed-dim">Excluir</span>
</button>
<!-- Action 4: Editar -->
<button class="flex-1 flex flex-col items-center justify-center gap-0.5 py-1 rounded-2xl text-on-surface-variant hover:text-on-surface active:bg-surface-bright/30 transition-all" type="button">
<span class="material-symbols-outlined" style="font-size: 22px;">tune</span>
<span class="font-label-sm text-label-sm tracking-tight text-on-surface-variant">Editar</span>
</button>
<!-- Action 5: Mais -->
<button class="flex-1 flex flex-col items-center justify-center gap-0.5 py-1 rounded-2xl text-on-surface-variant hover:text-on-surface active:bg-surface-bright/30 transition-all" type="button">
<span class="material-symbols-outlined" style="font-size: 22px;">more_horiz</span>
<span class="font-label-sm text-label-sm tracking-tight text-on-surface-variant">Mais</span>
</button>
</nav>
</div>
</div>
<script>
  (function () {
    const snackbar = document.getElementById('snackbar-delete');
    const undoBtn = document.getElementById('btn-undo');
    const deleteBtn = document.getElementById('btn-delete');
    const favBtn = document.getElementById('btn-fav');
    const favIcon = document.getElementById('fav-icon');
    const media = document.getElementById('zoomed-media');
    const stage = document.getElementById('zoom-stage');

    let isZoomed = true;
    let isFaved = true;

    // Toggle Zoom State on Double Click / Double Tap
    if (stage && media) {
      stage.addEventListener('dblclick', function () {
        if (isZoomed) {
          media.style.transform = 'scale(1) translate(0px, 0px)';
          isZoomed = false;
        } else {
          media.style.transform = 'scale(2.45) translate(-4%, 2%)';
          isZoomed = true;
        }
      });
    }

    // Undo Snackbar Action
    if (undoBtn && snackbar) {
      undoBtn.addEventListener('click', function () {
        snackbar.classList.add('opacity-0', 'translate-y-4');
        setTimeout(() => {
          snackbar.style.display = 'none';
        }, 300);
      });
    }

    // Re-trigger Snackbar when Excluir is tapped
    if (deleteBtn && snackbar) {
      deleteBtn.addEventListener('click', function () {
        snackbar.style.display = 'flex';
        requestAnimationFrame(() => {
          snackbar.classList.remove('opacity-0', 'translate-y-4');
        });
      });
    }

    // Favorite heart toggle
    if (favBtn && favIcon) {
      favBtn.addEventListener('click', function () {
        isFaved = !isFaved;
        if (isFaved) {
          favIcon.style.fontVariationSettings = "'FILL' 1";
          favIcon.classList.remove('text-on-surface-variant');
          favIcon.classList.add('text-tertiary');
        } else {
          favIcon.style.fontVariationSettings = "'FILL' 0";
          favIcon.classList.remove('text-tertiary');
          favIcon.classList.add('text-on-surface-variant');
        }
      });
    }
  })();
</script></main></body></html>

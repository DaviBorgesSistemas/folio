  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@24,300..700,0..1&amp;display=block" rel="stylesheet">
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      display: inline-block; width: 1em; height: 1em; line-height: 1 !important;
      box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle;
    }

    .editor-photo { border-radius: 6px; aspect-ratio: 4 / 3; }
    .editor-panel { height: 168px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
    .editor-tabs { height: 72px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
    .tab-label-xs { font-size: 12px; font-weight: 600; line-height: 16px; }

    .scrim-overlay {
      background: rgba(0, 0, 0, 0.62);
    }

    .strong-glass-dialog {
      background: rgba(34, 35, 44, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(22px) saturate(1.5);
      -webkit-backdrop-filter: blur(22px) saturate(1.5);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 10px 30px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body antialiased selection:bg-secondary-container selection:text-on-secondary-container">
  <div class="bg-background relative min-h-[884px] w-full flex flex-col overflow-hidden" data-stitch-vh="min-h-[884px]===min-h-screen">
    <!-- Dimmed Editor Underneath -->
    <header class="h-16 px-2 flex items-center justify-between gap-2 shrink-0" aria-hidden="true">
      <div class="flex items-center gap-1 min-w-0">
        <div class="w-11 h-11 rounded-full flex items-center justify-center text-on-surface">
          <span class="material-symbols-outlined text-[24px]">close</span>
        </div>
        <span class="font-title text-topbar-title text-on-surface">Editar</span>
      </div>
      <div class="flex items-center gap-2 pr-1">
        <div class="h-11 px-4 rounded-chip border border-outline text-on-surface font-label text-label-lg flex items-center">Restaurar</div>
        <div class="h-11 px-5 rounded-full bg-secondary-container text-on-secondary-container font-button text-button-ghost font-bold flex items-center">Salvar</div>
      </div>
    </header>

    <main class="bg-stage flex-1 px-3 flex items-center justify-center overflow-hidden" aria-hidden="true">
      <figure class="editor-photo w-full overflow-hidden">
        <svg class="w-full h-full block" viewBox="0 0 366 274" preserveAspectRatio="xMidYMid slice" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="366" height="274" fill="#1E356B"></rect>
          <circle cx="294" cy="56" r="18" fill="#EEF2FF" fill-opacity="0.92"></circle>
          <rect x="16" y="156" width="38" height="118" fill="#0B1124"></rect>
          <rect x="62" y="128" width="44" height="146" fill="#090E1E"></rect>
          <rect x="156" y="106" width="52" height="168" fill="#080D1C"></rect>
          <rect x="266" y="120" width="48" height="154" fill="#090E1E"></rect>
        </svg>
      </figure>
    </main>

    <section class="editor-panel bg-background px-4 pt-3 shrink-0 invisible" aria-hidden="true"></section>
    <nav class="editor-tabs bg-background shrink-0 invisible" aria-hidden="true"></nav>

    <!-- Scrim + Strong Glass Discard Dialog -->
    <div class="scrim-overlay absolute inset-0 flex items-center justify-center px-dialog-pad z-30">
      <!-- COMPONENT: modal-alert -->
      <section role="alertdialog" aria-modal="true" aria-labelledby="discard-dialog-title" aria-describedby="discard-dialog-body" data-component-id="modal-alert" data-component-type="modal" data-component-variant="alert" class="strong-glass-dialog w-full rounded-dialog p-dialog-pad flex flex-col gap-4">
        <h2 id="discard-dialog-title" data-design-text-token="dialog-title" class="font-title text-dialog-title text-on-surface">
          Descartar alterações?
        </h2>

        <p id="discard-dialog-body" data-design-text-token="body-md" class="font-body text-body-md text-on-surface-muted">
          As edições feitas nesta imagem serão perdidas.
        </p>

        <footer class="flex items-center justify-end gap-3 pt-2">
          <button type="button" class="h-12 px-5 rounded-full bg-white/10 text-on-surface font-label text-label-lg hover:bg-white/15">
            <span data-design-text-token="label-lg">Cancelar</span>
          </button>
          <button type="button" class="h-12 px-5 rounded-full bg-danger text-on-danger font-label text-label-lg hover:opacity-90">
            <span data-design-text-token="label-lg">Descartar</span>
          </button>
        </footer>
      </section>
    </div>
  </div>


</body></html>

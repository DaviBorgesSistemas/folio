  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@24,400,0&amp;display=block" rel="stylesheet">
  <style>
    .material-symbols-outlined {
      display: inline-block; width: 1em; height: 1em; line-height: 1 !important;

      background-color: #000000;
      color: #FFFFFF;

      height: 56px;
      padding: 0 12px;
    }

      margin-top: 48px;
      padding: 0 28px;
      font-size: 34px;
      font-weight: 400;
      line-height: 40px;
      color: #FFFFFF;
    }

      margin: 28px 20px 0 20px;
      padding: 22px 20px;
      border-radius: 28px;
      background-color: #262626;
    }

    .android-row-label {
      font-size: 17px;
      font-weight: 400;
      line-height: 22px;
      color: #FFFFFF;
    }

    .android-switch-off {
      width: 56px;
      height: 32px;
      padding: 4px;
      border-radius: 9999px;
      background-color: #4A4A4A;
    }

    .android-thumb-off {
      width: 24px;
      height: 24px;
      border-radius: 9999px;
      background-color: #E6E6E6;
    }

    .android-description {
      margin-top: 24px;
      padding: 0 48px;
      font-size: 14px;
      font-weight: 400;
      line-height: 1.45;

<body class="android-root antialiased">
  <main class="android-root min-h-[884px] w-full flex flex-col" data-stitch-vh="min-h-[884px]===min-h-screen">
    <!-- 1. 56px top bar with 24px white back arrow -->
    <header class="android-topbar flex items-center">
      <button type="button" aria-label="Voltar" class="w-11 h-11 rounded-full flex items-center justify-center text-white">
        <span class="material-symbols-outlined text-[24px]" aria-hidden="true">arrow_back</span>
      </button>
    </header>

    <!-- 2. 48px below: page title 34px regular -->
    <h1 class="android-title">Acesso a todos os arquivos</h1>

    <!-- 3. 28px below: rounded row with Material switch OFF -->
    <div class="android-row flex items-center justify-between gap-4">
      <span class="android-row-label">Acesso para gerenciar todos os arquivos</span>
      <div role="switch" aria-checked="false" aria-label="Acesso para gerenciar todos os arquivos" class="android-switch-off flex items-center justify-start shrink-0">
        <span class="android-thumb-off block"></span>
      </div>
    </div>

    <!-- 4. 24px below: description -->
    <p class="android-description">
      Permitir que o app leia, modifique e exclua todos os arquivos deste dispositivo ou de qualquer volume de armazenamento conectado. Se a permissão for concedida, o app poderá acessar arquivos sem nenhum aviso prévio.
    </p>
  </main>

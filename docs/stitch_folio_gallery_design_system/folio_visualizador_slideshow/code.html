  </head><body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col"><main class="flex flex-col relative w-full min-h-screen bg-surface"><div class="flex flex-col w-full relative select-none overflow-hidden pb-safe">
<!-- Slideshow Canvas Stage -->
<div class="relative w-full aspect-[9/16] max-h-[760px] flex items-center justify-center bg-surface-container-lowest overflow-hidden rounded-xl">
<!-- Active Photo (Contained 16:9 Stylized Sunset Landscape) -->
<div class="relative w-full aspect-video flex items-center justify-center z-0 px-1 shadow-2xl">
<img class="w-full h-full object-cover rounded-lg shadow-2xl transition-all duration-700 ease-out transform scale-100" data-alt="Cinematic 16:9 panoramic sunset landscape over coastal cliffs in Fernando de Noronha, Brazil. Golden hour warm light reflecting over crystalline turquoise ocean waves with dramatic atmospheric violet mist and soft glowing dusk clouds. Sharp architectural high fidelity photography." id="slideshow-image" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCRdllPstzoJSWxKPk4WjQ_f1dUVjczi2z03JH-zVupVtxSXDH7Md1hD_2Wiih12vFa6v-0mEzF9JEW8kFvTeby9Pu18ynfKErz1K3OKrP9gyRxCHBJKhKRq0M-lj-kZAosuXtaGL6NaptrBCopgVCZqM41bihJvAywbdkO3DCoonGBdgqetwqD1E3qiaTndUDYVgyAIcGADIJu9_4TsKiDvq3zSTnH6_FPqfE1D3E"/>
<!-- Dynamic Light Scrim over photo edges -->
<div class="absolute inset-0 rounded-lg pointer-events-none bg-gradient-to-t from-surface-container-lowest/40 via-transparent to-surface-container-lowest/20"></div>
</div>
<!-- Chromatic Atmospheric Glows behind stage -->
<div class="absolute -top-24 left-1/2 -translate-x-1/2 w-80 h-80 bg-primary-container/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-20 right-4 w-72 h-72 bg-secondary-container/20 rounded-full blur-3xl pointer-events-none"></div>
<!-- Top Overlay Bar (72px) -->
<header class="absolute top-0 inset-x-0 h-[72px] z-30 flex items-center justify-between px-space-md bg-gradient-to-b from-surface-container-lowest/90 via-surface-container-lowest/60 to-transparent backdrop-blur-md">
<!-- Back Action Button -->
<button aria-label="Voltar para a grade de fotos" class="w-11 h-11 rounded-full flex items-center justify-center bg-surface-bright/40 text-on-surface hover:bg-surface-bright/70 active:scale-95 transition-all duration-150" id="btn-back" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<!-- Center Metadata (Timestamp & Progress) -->
<div class="flex flex-col items-center justify-center text-center">
<h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight font-extrabold leading-none">
          Hoje 14:32
        </h1>
<span class="font-label-sm text-label-sm text-on-surface-variant font-medium mt-1">
          3 de 48
        </span>
</div>
<!-- Trailing Action Icons -->
<div class="flex items-center space-x-space-xs">
<button aria-label="Marcar como favorito" class="w-11 h-11 rounded-full flex items-center justify-center bg-surface-bright/40 text-on-surface hover:bg-surface-bright/70 active:scale-95 transition-all duration-150" id="btn-favorite" type="button">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">favorite</span>
</button>
<button aria-label="Informações da imagem" class="w-11 h-11 rounded-full flex items-center justify-center bg-surface-bright/40 text-on-surface hover:bg-surface-bright/70 active:scale-95 transition-all duration-150" type="button">
<span class="material-symbols-outlined text-[24px]">info</span>
</button>
</div>
</header>
<!-- Floating Slideshow Indicator Badge (Centered at top) -->
<div class="absolute top-[82px] inset-x-0 flex justify-center z-30 pointer-events-auto px-4">
<button class="h-11 px-5 rounded-full flex items-center gap-2 bg-primary-container text-on-primary-fixed shadow-xl hover:opacity-95 active:scale-95 transition-all duration-150" id="btn-stop-slideshow" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">stop</span>
<span class="font-label-md text-label-md font-bold tracking-tight">Parar slideshow</span>
<span class="w-1.5 h-1.5 rounded-full bg-on-primary-container animate-pulse ml-0.5"></span>
</button>
</div>
<!-- Navigation Chevrons: Frosted Glass Edge Buttons -->
<div class="absolute inset-y-0 inset-x-2 flex items-center justify-between pointer-events-none z-20">
<!-- Previous Photo -->
<button aria-label="Foto anterior" class="pointer-events-auto w-11 h-11 rounded-full flex items-center justify-center bg-surface-container-high/60 backdrop-blur-xl text-on-surface shadow-lg hover:bg-surface-bright/80 active:scale-90 transition-all duration-200" id="btn-prev" type="button">
<span class="material-symbols-outlined text-[26px]">chevron_left</span>
</button>
<!-- Next Photo -->
<button aria-label="Próxima foto" class="pointer-events-auto w-11 h-11 rounded-full flex items-center justify-center bg-surface-container-high/60 backdrop-blur-xl text-on-surface shadow-lg hover:bg-surface-bright/80 active:scale-90 transition-all duration-200" id="btn-next" type="button">
<span class="material-symbols-outlined text-[26px]">chevron_right</span>
</button>
</div>
<!-- Ambient Slideshow Progress Line Indicator -->
<div class="absolute bottom-24 inset-x-space-lg flex flex-col items-center gap-1.5 z-20 pointer-events-none">
<div class="w-48 h-1 bg-surface-variant/70 rounded-full overflow-hidden backdrop-blur-sm">
<div class="h-full bg-primary-container rounded-full w-2/3 transition-all duration-300" id="slideshow-progress"></div>
</div>
<span class="font-label-sm text-[11px] text-on-surface-variant font-medium tracking-wide">
        Transição suave • 5s
      </span>
</div>
<!-- Detached Floating Action Bar (Height 68px, Radius 28px, 14px Margins) -->
<nav aria-label="Barra de ações da fotografia" class="absolute bottom-3 inset-x-space-md h-[68px] z-30 rounded-[28px] bg-surface-container-high/80 backdrop-blur-2xl shadow-2xl px-2 flex items-center justify-around">
<!-- Compartilhar -->
<button class="flex flex-col items-center justify-center min-w-0 flex-1 py-1 text-on-surface-variant hover:text-on-surface active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[22px]">ios_share</span>
<span class="font-label-sm text-[11px] font-medium mt-0.5 truncate">Compartilhar</span>
</button>
<!-- Bloquear -->
<button class="flex flex-col items-center justify-center min-w-0 flex-1 py-1 text-on-surface-variant hover:text-on-surface active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[22px]">lock</span>
<span class="font-label-sm text-[11px] font-medium mt-0.5 truncate">Bloquear</span>
</button>
<!-- Excluir -->
<button class="flex flex-col items-center justify-center min-w-0 flex-1 py-1 text-on-surface-variant hover:text-error active:scale-95 transition-all" id="btn-delete" type="button">
<span class="material-symbols-outlined text-[22px]">delete</span>
<span class="font-label-sm text-[11px] font-medium mt-0.5 truncate">Excluir</span>
</button>
<!-- Editar -->
<button class="flex flex-col items-center justify-center min-w-0 flex-1 py-1 text-on-surface-variant hover:text-on-surface active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[22px]">tune</span>
<span class="font-label-sm text-[11px] font-medium mt-0.5 truncate">Editar</span>
</button>
<!-- Mais -->
<button class="flex flex-col items-center justify-center min-w-0 flex-1 py-1 text-on-surface-variant hover:text-on-surface active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[22px]">more_horiz</span>
<span class="font-label-sm text-[11px] font-medium mt-0.5 truncate">Mais</span>
</button>
</nav>
</div>
<!-- Interactive State Feedback Modal / Toast (Hidden by default) -->
<aside aria-live="polite" class="fixed bottom-24 inset-x-space-md z-40 transform translate-y-8 opacity-0 pointer-events-none transition-all duration-300 flex justify-center" id="feedback-toast">
<div class="h-12 px-space-md rounded-full bg-inverse-surface text-inverse-on-surface flex items-center justify-between shadow-2xl gap-3">
<span class="font-label-md text-label-md font-semibold" id="toast-text">Slideshow pausado</span>
<button class="font-label-md text-label-md font-bold text-on-primary-container bg-primary-container px-3 py-1 rounded-full active:scale-95 transition-transform" id="toast-action" type="button">
        Continuar
      </button>
</div>
</aside>
</div>
<script>
  (function () {
    const stopButton = document.getElementById('btn-stop-slideshow');
    const toast = document.getElementById('feedback-toast');
    const toastText = document.getElementById('toast-text');
    const toastAction = document.getElementById('toast-action');
    const favButton = document.getElementById('btn-favorite');
    const image = document.getElementById('slideshow-image');
    const progressBar = document.getElementById('slideshow-progress');
    const prevBtn = document.getElementById('btn-prev');
    const nextBtn = document.getElementById('btn-next');

    let isPlaying = true;
    let progressVal = 66;

    function showToast(message, actionLabel, onAction) {
      if (!toast) return;
      toastText.textContent = message;
      toastAction.textContent = actionLabel;
      toast.classList.remove('opacity-0', 'translate-y-8', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');

      toastAction.onclick = () => {
        hideToast();
        if (onAction) onAction();
      };

      setTimeout(() => {
        hideToast();
      }, 4000);
    }

    function hideToast() {
      if (!toast) return;
      toast.classList.add('opacity-0', 'translate-y-8', 'pointer-events-none');
      toast.classList.remove('opacity-100', 'translate-y-0');
    }

    if (stopButton) {
      stopButton.addEventListener('click', () => {
        isPlaying = !isPlaying;
        if (!isPlaying) {
          stopButton.innerHTML = `
            <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
            <span class="font-label-md text-label-md font-bold tracking-tight">Iniciar slideshow</span>
          `;
          showToast('Slideshow interrompido', 'Reiniciar', () => {
            stopButton.click();
          });
        } else {
          stopButton.innerHTML = `
            <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">stop</span>
            <span class="font-label-md text-label-md font-bold tracking-tight">Parar slideshow</span>
            <span class="w-1.5 h-1.5 rounded-full bg-on-primary-container animate-pulse ml-0.5"></span>
          `;
          showToast('Apresentação retomada', 'Ok');
        }
      });
    }

    if (favButton) {
      favButton.addEventListener('click', () => {
        const icon = favButton.querySelector('span');
        const isFilled = icon.style.fontVariationSettings?.includes("'FILL' 1");
        if (isFilled) {
          icon.style.fontVariationSettings = "'FILL' 0";
          favButton.classList.remove('text-tertiary-fixed-dim');
          favButton.classList.add('text-on-surface');
        } else {
          icon.style.fontVariationSettings = "'FILL' 1";
          favButton.classList.add('text-tertiary-fixed-dim');
          favButton.classList.remove('text-on-surface');
        }
      });
    }

    function nudgeImage() {
      if (!image) return;
      image.style.opacity = '0.7';
      image.style.transform = 'scale(0.98)';
      setTimeout(() => {
        image.style.opacity = '1';
        image.style.transform = 'scale(1)';
      }, 200);
    }

    if (prevBtn) {
      prevBtn.addEventListener('click', () => {
        progressVal = Math.max(10, progressVal - 15);
        if (progressBar) progressBar.style.width = progressVal + '%';
        nudgeImage();
      });
    }

    if (nextBtn) {
      nextBtn.addEventListener('click', () => {
        progressVal = Math.min(100, progressVal + 15);
        if (progressBar) progressBar.style.width = progressVal + '%';
        nudgeImage();
      });
    }
  })();
</script></main></body></html>

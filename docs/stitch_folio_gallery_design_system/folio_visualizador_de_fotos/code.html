<!-- Floating Action Bar (Detached Chrome: 14px outer margin, 68px tall, 28px radius) -->
<div class="relative z-20 w-full px-space-md pb-space-md pt-2">

<span class="font-label-md text-label-md font-semibold">4032 × 2268 (16:9)</span>
</div>
<div class="flex items-center justify-between py-2 px-3 rounded-lg bg-surface-container">
<span class="font-body-sm text-body-sm text-on-surface-variant">Lente &amp; Câmera</span>
<span class="font-label-md text-label-md font-semibold">24mm ƒ/1.78 • ISO 40</span>
</div>

<span class="font-body-sm text-body-sm text-on-surface-variant">Localização</span>

</div>
</div>
</div>

<script>
  (function() {
    const favBtn = document.getElementById('favorite-btn');
    const favIcon = document.getElementById('favorite-icon');
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toast-text');
    const infoBtn = document.getElementById('info-btn');
    const metaSheet = document.getElementById('metadata-sheet');
    const closeMetaBtn = document.getElementById('close-meta-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const photo = document.getElementById('active-photo');

    let isFav = false;
    let toastTimeout = null;

    function showToast(msg) {
      if (toastTimeout) clearTimeout(toastTimeout);
      toastText.textContent = msg;
      toast.classList.remove('opacity-0', 'translate-y-3', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');
      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-3', 'pointer-events-none');
      }, 2400);
    }

    if (favBtn && favIcon) {
      favBtn.addEventListener('click', () => {
        isFav = !isFav;
        if (isFav) {
          favIcon.style.fontVariationSettings = "'FILL' 1";
          favIcon.classList.add('text-error');
          showToast('Adicionado aos Favoritos');
        } else {
          favIcon.style.fontVariationSettings = "'FILL' 0";
          favIcon.classList.remove('text-error');
          showToast('Removido dos Favoritos');
        }
      });
    }

    if (infoBtn && metaSheet) {
      infoBtn.addEventListener('click', () => {
        metaSheet.classList.remove('opacity-0', 'pointer-events-none');
        metaSheet.classList.add('opacity-100');
      });
    }

    if (closeMetaBtn && metaSheet) {
      closeMetaBtn.addEventListener('click', () => {
        metaSheet.classList.remove('opacity-100');
        metaSheet.classList.add('opacity-0', 'pointer-events-none');
      });
      metaSheet.addEventListener('click', (e) => {
        if (e.target === metaSheet) {
          metaSheet.classList.remove('opacity-100');
          metaSheet.classList.add('opacity-0', 'pointer-events-none');
        }
      });
    }

    const nudgePhoto = (direction) => {
      if (!photo) return;
      photo.style.transform = `translateX(${direction * 12}px) scale(0.98)`;
      setTimeout(() => {
        photo.style.transform = 'translateX(0px) scale(1)';
      }, 160);
    };

    if (prevBtn) prevBtn.addEventListener('click', () => nudgePhoto(-1));
    if (nextBtn) nextBtn.addEventListener('click', () => nudgePhoto(1));
  })();
</script></main></body></html>

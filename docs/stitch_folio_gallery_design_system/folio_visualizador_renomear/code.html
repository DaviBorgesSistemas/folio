</div>
<!-- Atmospheric Vignette & Scrim Gradient -->
<div class="absolute inset-0 bg-gradient-to-b from-surface-container-lowest/80 via-transparent to-surface-container-lowest/90"></div>
<!-- Subtle Glass Header Mock (Viewer Context behind dialog) -->
<header class="relative z-10 w-full px-margin pt-4 flex items-center justify-between opacity-40 pointer-events-none">

</div>
<div class="flex flex-col items-center">

</div>
<div class="w-10 h-10 rounded-full bg-surface-container/60 backdrop-blur-md flex items-center justify-center text-on-surface">

<input autocomplete="off" class="w-full bg-transparent font-body-lg text-body-lg text-on-surface placeholder:text-outline focus:outline-none pr-8 select-text tracking-[0.01em]" id="photo-rename-input" spellcheck="false" type="text" value="IMG_4821.jpg"/>
<!-- Clear micro-action -->
<button aria-label="Limpar texto" class="absolute right-3.5 w-6 h-6 rounded-full bg-surface-variant/70 text-on-surface-variant flex items-center justify-center hover:bg-surface-bright active:scale-90 transition-transform" id="clear-btn" type="button">
<span class="material-symbols-outlined text-[15px]">close</span>
</button>
</div>
<!-- Micro Information String / Extension Helper -->
<div class="flex items-center justify-between px-3 pt-0.5">
<span class="font-label-sm text-[11px] text-outline">Extensão preservada (.jpg)</span>
<span class="font-label-sm text-[11px] text-primary" id="char-counter">12 caracteres</span>
</div>
</div>
<!-- Interactive Buttons Action Row -->
<div class="mt-5 flex items-center justify-end gap-2.5">
<!-- Cancel Action Pill -->
<button class="h-10 px-5 rounded-full bg-surface-container-highest/70 active:bg-surface-bright text-on-surface font-label-md text-[14px] font-semibold transition-all duration-150 active:scale-95 flex items-center justify-center" id="btn-cancelar" type="button">
          Cancelar
        </button>
<!-- Submit OK Pill -->
<button class="h-10 px-6 rounded-full bg-primary-container text-on-primary-container font-label-md text-[14px] font-bold shadow-[0_4px_16px_rgba(191,194,255,0.25)] active:opacity-90 active:scale-95 transition-all duration-150 flex items-center justify-center" id="btn-ok" type="button">
          OK
        </button>
</div>
</div>
</div>
<!-- Local Script for Micro-Interactions -->
<script>
    (function() {
      const input = document.getElementById('photo-rename-input');
      const clearBtn = document.getElementById('clear-btn');
      const counter = document.getElementById('char-counter');
      const btnOk = document.getElementById('btn-ok');
      const btnCancel = document.getElementById('btn-cancelar');
      const container = document.getElementById('dialog-container');

      function updateCounter() {
        if (!input || !counter) return;
        const len = input.value.length;
        counter.textContent = len + (len === 1 ? ' caractere' : ' caracteres');
      }

      if (input) {
        // Pre-select filename portion without extension on initial load for optimal UX
        setTimeout(() => {
          input.focus();
          const dotIndex = input.value.lastIndexOf('.');
          if (dotIndex > 0) {
            input.setSelectionRange(0, dotIndex);
          } else {
            input.select();
          }
        }, 150);

        input.addEventListener('input', updateCounter);
      }

      if (clearBtn && input) {
        clearBtn.addEventListener('click', (e) => {
          e.preventDefault();
          input.value = '';
          updateCounter();
          input.focus();
        });
      }

      if (btnCancel && container) {
        btnCancel.addEventListener('click', () => {
          container.style.transform = 'scale(0.95)';
          container.style.opacity = '0.5';
          setTimeout(() => {
            container.style.transform = 'scale(1)';
            container.style.opacity = '1';
          }, 200);
        });
      }

      if (btnOk && container) {
        btnOk.addEventListener('click', () => {
          btnOk.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span>';
          setTimeout(() => {
            btnOk.innerHTML = 'OK';
          }, 500);
        });
      }
    })();
  </script>

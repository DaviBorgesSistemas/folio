<script>
  (function() {
    const undoButton = document.getElementById('btnUndo');
    const snackbar = document.getElementById('undoSnackbar');

    if (undoButton && snackbar) {
      undoButton.addEventListener('click', () => {
        snackbar.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
        setTimeout(() => {
          snackbar.remove();
        }, 320);
      });
    }
  })();

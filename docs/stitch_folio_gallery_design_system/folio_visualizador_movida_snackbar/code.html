  </head><body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col"><main class="flex flex-col relative w-full min-h-screen bg-surface"><div class="flex flex-col w-full relative select-none">
<!-- Immersive Viewer Stage -->
<div class="relative w-full h-[812px] bg-[#0A0A0B] overflow-hidden flex flex-col justify-between">
<!-- Ambient Atmospheric Glow Backdrop -->
<div class="absolute -top-32 -left-20 w-80 h-80 rounded-full bg-primary-container/10 blur-[110px] pointer-events-none"></div>
<div class="absolute -bottom-24 -right-16 w-72 h-72 rounded-full bg-secondary-container/15 blur-[100px] pointer-events-none"></div>
<!-- Top Overlay App Bar (Glassmorphic Material 3 detached bar) -->
<header class="relative z-30 flex items-center justify-between px-space-md pt-3 pb-3 mx-space-md mt-2 rounded-[24px] bg-[#22232c]/65 backdrop-blur-[24px] shadow-lg shadow-black/40">
<div class="flex items-center gap-space-sm min-w-0">
<button aria-label="Voltar" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-variant/40 active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<div class="flex flex-col min-w-0">
<span class="font-title-sm text-title-sm text-on-surface truncate">Hoje, 14:32</span>
<span class="font-label-sm text-label-sm text-on-surface-variant leading-none">4 de 48</span>
</div>
</div>
<div class="flex items-center gap-1">
<button aria-label="Favoritar foto" class="w-10 h-10 flex items-center justify-center rounded-full text-primary hover:bg-surface-variant/40 active:scale-90 transition-transform" id="favorite-toggle" type="button">
<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">favorite</span>
</button>
<button aria-label="Informações da imagem" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:text-on-surface hover:bg-surface-variant/40 active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[22px]">info</span>
</button>
</div>
</header>
<!-- Main Photographic Stage (Pristine, non-glassified unadulterated photo) -->
<div class="relative z-10 flex-1 flex items-center justify-center px-2 py-4">
<div class="relative w-full max-h-[580px] aspect-[4/5] rounded-[24px] overflow-hidden shadow-2xl shadow-black/80 bg-surface-container-lowest">
<img class="w-full h-full object-cover object-center" data-alt="Editorial portrait photograph of a woman outdoors at golden hour sunset in Rio de Janeiro, dramatic soft lighting, deep shadows, cinematic warm tones, rim light on hair, high fidelity 35mm film aesthetic, sharp focus and natural skin texture." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBrEWySp0kcQoUs0a0XA8SwgFjsC6_CkcA1gy8I9j8GjqZTz2zB6gg4OabH3L44k8CkUSBIiLOCq5TuyTBPliqUahp1HmE6MXx52rkiCGA1dKJznV2W_hloQLqsFpeMDvyBm996LLhsfeS6cTEFg1ix2LOCy2cccQ0zim0Qs8IMz6meeR9eb8LFHeJsp_LOh_WuzLtYaTj6Vv8Of7Hn9igZtvLtVgpndT4s5__stjY"/>
<!-- Subtle Gradient Scrim at Stage Perimeters for Seamless Chrome Contrast -->
<div class="absolute inset-x-0 top-0 h-16 bg-gradient-to-b from-black/40 to-transparent pointer-events-none"></div>
<div class="absolute inset-x-0 bottom-0 h-20 bg-gradient-to-t from-black/60 to-transparent pointer-events-none"></div>
</div>
</div>
<!-- Floating Material 3 Confirmation Snackbar -->
<div class="absolute left-0 right-0 bottom-[88px] z-40 flex justify-center px-margin pointer-events-none transition-all duration-300" id="snackbar-container">
<div class="pointer-events-auto flex items-center justify-between w-full max-w-[358px] bg-inverse-surface text-inverse-on-surface rounded-full px-5 py-3 shadow-[0_12px_32px_rgba(0,0,0,0.55)]">
<div class="flex items-center gap-space-sm min-w-0 pr-2">
<span class="material-symbols-outlined text-on-primary-fixed text-[20px] shrink-0" style="font-variation-settings: 'FILL' 1;">folder</span>
<span class="font-label-md text-label-md font-semibold text-[#121318] truncate tracking-normal">
            Movida para WhatsApp
          </span>
</div>
<button class="shrink-0 h-8 px-3 rounded-full bg-primary-container/25 text-[#3b3e8f] font-label-sm text-label-sm font-bold flex items-center justify-center hover:bg-primary-container/40 active:scale-95 transition-all" id="undo-btn" type="button">
          Desfazer
        </button>
</div>
</div>
<!-- Detached Bottom Floating Action Bar -->
<div class="relative z-30 mx-margin mb-4 h-[68px] rounded-[28px] bg-[#22232c]/65 backdrop-blur-[24px] shadow-[0_12px_32px_rgba(0,0,0,0.65)] flex items-center justify-around px-2">
<!-- Compartilhar -->
<button class="flex flex-col items-center justify-center w-12 h-12 rounded-full text-on-surface hover:text-primary active:scale-90 transition-transform" type="button">
<span class="material-symbols-outlined text-[24px]">share</span>
<span class="sr-only">Compartilhar</span>
</button>
<!-- Bloquear / Ocultar -->
<button class="flex flex-col items-center justify-center w-12 h-12 rounded-full text-on-surface-variant hover:text-on-surface active:scale-90 transition-transform" type="button">
<span class="material-symbols-outlined text-[24px]">lock</span>
<span class="sr-only">Bloquear</span>
</button>
<!-- Editar -->
<button class="flex flex-col items-center justify-center w-12 h-12 rounded-full text-on-surface hover:text-primary active:scale-90 transition-transform" type="button">
<span class="material-symbols-outlined text-[24px]">tune</span>
<span class="sr-only">Editar</span>
</button>
<!-- Excluir -->
<button class="flex flex-col items-center justify-center w-12 h-12 rounded-full text-error/90 hover:text-error active:scale-90 transition-transform" type="button">
<span class="material-symbols-outlined text-[24px]">delete</span>
<span class="sr-only">Excluir</span>
</button>
<!-- Mais Opções -->
<button class="flex flex-col items-center justify-center w-12 h-12 rounded-full text-on-surface-variant hover:text-on-surface active:scale-90 transition-transform" type="button">
<span class="material-symbols-outlined text-[24px]">more_vert</span>
<span class="sr-only">Mais</span>
</button>
</div>
</div>
</div>
<script>
  (function() {
    const undoBtn = document.getElementById('undo-btn');
    const snackbar = document.getElementById('snackbar-container');
    const favBtn = document.getElementById('favorite-toggle');

    if (undoBtn && snackbar) {
      undoBtn.addEventListener('click', function() {
        snackbar.style.opacity = '0';
        snackbar.style.transform = 'translateY(12px) scale(0.96)';
        setTimeout(() => {
          snackbar.style.display = 'none';
        }, 300);
      });
    }

    if (favBtn) {
      favBtn.addEventListener('click', function() {
        const icon = favBtn.querySelector('.material-symbols-outlined');
        if (icon) {
          const isFilled = icon.style.fontVariationSettings.includes("'FILL' 1");
          icon.style.fontVariationSettings = isFilled ? "'FILL' 0" : "'FILL' 1";
          favBtn.classList.toggle('text-primary');
          favBtn.classList.toggle('text-on-surface-variant');
        }
      });
    }
  })();
</script></main></body></html>

<!DOCTYPE html><html lang="pt-BR"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Folio — WhatsApp (Seleção)</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">/** @type {import('tailwindcss').Config} */

      },
      borderRadius: {

        'menu': '24px',
        'card': '28px',
        'bar': '28px',
        'button': '28px',
        'dialog': '28px',
        'sheet-top': '28px',
        'full': '9999px',
      },
      spacing: {
        'collage-gap': '2px',
        'grid-photo-gap': '4px',
        'card-text-x': '6px',
        'screen-photo-x': '8px',
        'card-pad': '8px',
        'card-pad-bottom': '12px',
        'bar-margin': '14px',
        'chip-pad-x': '16px',
        'dialog-pad': '24px',
        'sheet-pad-y': '28px',
      },
      fontFamily: {
        'display': ['"Plus Jakarta Sans"', 'sans-serif'],
        'title': ['"Plus Jakarta Sans"', 'sans-serif'],
        'button': ['"Plus Jakarta Sans"', 'sans-serif'],
        'label': ['"Plus Jakarta Sans"', 'sans-serif'],
        'body': ['"Plus Jakarta Sans"', 'sans-serif'],
        'caption': ['"Plus Jakarta Sans"', 'sans-serif'],
      },
      fontSize: {
        'display-num': ['64px', { lineHeight: '72px', letterSpacing: '-1.92px', fontWeight: '800' }],
        'display-num-mobile': ['32px', { lineHeight: '38px', letterSpacing: '-0.96px', fontWeight: '800' }],
        'screen-title': ['34px', { lineHeight: '40px', letterSpacing: '-1.19px', fontWeight: '800' }],
        'screen-title-mobile': ['32px', { lineHeight: '38px', letterSpacing: '-1.12px', fontWeight: '800' }],
        'dialog-title': ['22px', { lineHeight: '28px', letterSpacing: '-0.44px', fontWeight: '800' }],
        'topbar-title': ['20px', { lineHeight: '26px', letterSpacing: '-0.2px', fontWeight: '700' }],
        'button-lg': ['17px', { lineHeight: '22px', letterSpacing: '0px', fontWeight: '700' }],
        'title-md': ['16px', { lineHeight: '22px', letterSpacing: '0px', fontWeight: '700' }],
        'menu-label': ['16px', { lineHeight: '22px', letterSpacing: '0px', fontWeight: '600' }],
        'body-lg': ['16px', { lineHeight: '24px', letterSpacing: '0px', fontWeight: '400' }],
        'body-md': ['15px', { lineHeight: '22px', letterSpacing: '0px', fontWeight: '400' }],
        'button-ghost': ['15px', { lineHeight: '20px', letterSpacing: '0px', fontWeight: '600' }],
        'label-lg': ['14px', { lineHeight: '20px', letterSpacing: '0px', fontWeight: '600' }],
        'caption-md': ['14px', { lineHeight: '20px', letterSpacing: '0px', fontWeight: '400' }],
        'label-md': ['13px', { lineHeight: '18px', letterSpacing: '0px', fontWeight: '600' }],
        'caption-sm': ['13px', { lineHeight: '18px', letterSpacing: '0px', fontWeight: '400' }],
      },
      transitionDuration: {
        'state-change': '100ms',
        'surface-enter': '250ms',
        'surface-exit': '150ms',
      },
      transitionDelay: {
        'state-change': '0ms',
        'surface-enter': '0ms',
        'surface-exit': '0ms',
      },
      transitionTimingFunction: {
        'state-change': 'ease-out',
        'surface-enter': 'cubic-bezier(0.2, 0, 0, 1)',

      },
    },
  },

if (typeof module !== 'undefined') module.exports = globalThis.tailwind.config;
</script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL@24,300..700,0..1&amp;display=block" rel="stylesheet">
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      display: inline-block; width: 1em; height: 1em; line-height: 1 !important;
      box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle;
    }
    .icon-filled { font-variation-settings: 'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 24; }

    .folio-canvas {
      background-color: #121318;
      background-image:
        radial-gradient(circle at 8% 8%, rgba(122, 128, 255, 0.34) 0%, transparent 52%),
        radial-gradient(circle at 96% 28%, rgba(255, 128, 190, 0.20) 0%, transparent 48%),
        radial-gradient(circle at 12% 92%, rgba(60, 200, 210, 0.20) 0%, transparent 50%);
    }

    .strong-glass-bar {
      left: 14px;
      right: 14px;
      bottom: 14px;
      height: 68px;
      background: rgba(34, 35, 44, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(22px) saturate(1.5);
      -webkit-backdrop-filter: blur(22px) saturate(1.5);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .select-ring-off {
      width: 24px;
      height: 24px;
      border: 2px solid #FFFFFF;
      background-color: rgba(0, 0, 0, 0.35);
    }

    .select-ring-on {
      width: 24px;
      height: 24px;
    }

    .bar-label-xs {
      font-size: 11px;
      font-weight: 600;
      line-height: 14px;
    }

    .fav-shadow { filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.65)); }

    .sc-sunset { background: linear-gradient(180deg, #ffccb3 0%, #ff7b6b 55%, #5c2b48 100%); }
    .sc-dusk { background: linear-gradient(180deg, #16224a 0%, #2b3f7a 62%, #101528 100%); }
    .sc-golden { background: linear-gradient(180deg, #ffd89b 0%, #e07a5f 58%, #6d3227 100%); }
    .sc-pastel { background: linear-gradient(155deg, #8ee3ef 0%, #f7b2cc 65%, #8470a8 100%); }
    .sc-night { background: linear-gradient(180deg, #0b2a32 0%, #134752 60%, #07191e 100%); }
    .sc-violet { background: linear-gradient(155deg, #5d2e8c 0%, #d4529a 62%, #2a1842 100%); }
    .sc-tealblue { background: linear-gradient(170deg, #3cc8d2 0%, #3a6bc4 65%, #18234f 100%); }
    .sc-coral { background: linear-gradient(145deg, #ff9a8b 0%, #ff6a88 55%, #3d1d3c 100%); }
    .sc-hill-dark { background: rgba(20, 16, 36, 0.78); }
    .sc-hill-terra { background: rgba(122, 46, 31, 0.82); }
    .sc-moon { background: rgba(238, 242, 255, 0.90); }
    .sc-tower { background: #051216; }
    .sc-win { background: rgba(255, 216, 155, 0.82); }
  </style>
</head>
<body class="bg-background text-on-background font-body antialiased selection:bg-secondary-container selection:text-on-secondary-container">
  <div class="folio-canvas relative min-h-[884px] w-full pb-28 overflow-x-hidden" data-stitch-vh="min-h-[884px]===min-h-screen">
    <!-- Selection top bar (64px) -->
    <header class="h-16 px-2 flex items-center gap-2">
      <!-- COMPONENT: button-icon -->
      <button data-component-id="button-icon" data-component-type="button" data-component-variant="icon" type="button" aria-label="Cancelar seleção" class="w-11 h-11 rounded-full bg-transparent text-on-surface flex items-center justify-center shrink-0 hover:bg-white/10">
        <span class="material-symbols-outlined text-[24px]" aria-hidden="true">close</span>
      </button>
      <h1 class="font-title text-topbar-title text-on-surface tabular-nums" data-design-text-token="topbar-title">3 selecionadas</h1>
    </header>

    <!-- 3-column photo grid with selection circles (3 selected, 2 favorites) -->
    <main class="px-screen-photo-x mt-1 grid grid-cols-3 gap-grid-photo-gap">
      <!-- 1 (SELECTED) -->
      <div class="aspect-square rounded-tile overflow-hidden relative bg-surface">
        <div class="sc-sunset absolute inset-0 opacity-60">
          <div class="sc-hill-dark absolute inset-x-0 bottom-0 h-2/5 rounded-t-[100%]"></div>
        </div>
        <span class="select-ring-on rounded-full bg-primary text-on-primary flex items-center justify-center absolute top-2 left-2" aria-label="Selecionada">
          <span class="material-symbols-outlined text-[16px]" aria-hidden="true">check</span>
        </span>
      </div>

      <!-- 2 (UNSELECTED, FAVORITE 1) -->
      <div class="aspect-square rounded-tile overflow-hidden sc-dusk relative">
        <div class="sc-moon absolute top-3 right-3 w-3 h-3 rounded-full"></div>
        <span class="select-ring-off rounded-full absolute top-2 left-2"></span>
        <span class="material-symbols-outlined icon-filled fav-shadow text-[18px] text-primary absolute right-1.5 bottom-1.5">favorite</span>
      </div>

      <!-- 3 (SELECTED) -->
      <div class="aspect-square rounded-tile overflow-hidden relative bg-surface">
        <div class="sc-golden absolute inset-0 opacity-60">
          <div class="sc-hill-terra absolute inset-x-0 bottom-0 h-1/2 rounded-t-[80%]"></div>
        </div>
        <span class="select-ring-on rounded-full bg-primary text-on-primary flex items-center justify-center absolute top-2 left-2" aria-label="Selecionada">
          <span class="material-symbols-outlined text-[16px]" aria-hidden="true">check</span>
        </span>
      </div>

      <!-- 4 (UNSELECTED) -->
      <div class="aspect-square rounded-tile overflow-hidden sc-pastel relative">
        <div class="absolute top-2.5 left-2.5 w-10 h-10 rounded-full bg-white/30"></div>
        <span class="select-ring-off rounded-full absolute top-2 left-2"></span>
      </div>

      <!-- 5 (SELECTED) -->
      <div class="aspect-square rounded-tile overflow-hidden relative bg-surface">
        <div class="sc-night absolute inset-0 opacity-60">
          <div class="sc-tower absolute bottom-0 left-3 w-4 h-10"></div>
          <div class="sc-tower absolute bottom-0 left-8 w-5 h-14"></div>
          <div class="sc-win absolute bottom-7 left-9 w-1 h-1"></div>
        </div>
        <span class="select-ring-on rounded-full bg-primary text-on-primary flex items-center justify-center absolute top-2 left-2" aria-label="Selecionada">
          <span class="material-symbols-outlined text-[16px]" aria-hidden="true">check</span>
        </span>
      </div>

      <!-- 6 (UNSELECTED, FAVORITE 2) -->
      <div class="aspect-square rounded-tile overflow-hidden sc-violet relative">
        <div class="sc-hill-dark absolute inset-x-0 bottom-0 h-2/5 rounded-t-[90%]"></div>
        <span class="select-ring-off rounded-full absolute top-2 left-2"></span>
        <span class="material-symbols-outlined icon-filled fav-shadow text-[18px] text-primary absolute right-1.5 bottom-1.5">favorite</span>
      </div>

      <!-- 7..18 unselected -->
      <div class="aspect-square rounded-tile overflow-hidden sc-tealblue relative"><span class="select-ring-off rounded-full absolute top-2 left-2"></span></div>
      <div class="aspect-square rounded-tile overflow-hidden sc-coral relative"><span class="select-ring-off rounded-full absolute top-2 left-2"></span></div>
      <div class="aspect-square rounded-tile overflow-hidden sc-golden relative"><span class="select-ring-off rounded-full absolute top-2 left-2"></span></div>
      <div class="aspect-square rounded-tile overflow-hidden sc-dusk relative"><span class="select-ring-off rounded-full absolute top-2 left-2"></span></div>
      <div class="aspect-square rounded-tile overflow-hidden sc-pastel relative"><span class="select-ring-off rounded-full absolute top-2 left-2"></span></div>
      <div class="aspect-square rounded-tile overflow-hidden sc-sunset relative"><span class="select-ring-off rounded-full absolute top-2 left-2"></span></div>
      <div class="aspect-square rounded-tile overflow-hidden sc-violet relative"><span class="select-ring-off rounded-full absolute top-2 left-2"></span></div>
      <div class="aspect-square rounded-tile overflow-hidden sc-night relative"><span class="select-ring-off rounded-full absolute top-2 left-2"></span></div>
      <div class="aspect-square rounded-tile overflow-hidden sc-tealblue relative"><span class="select-ring-off rounded-full absolute top-2 left-2"></span></div>
      <div class="aspect-square rounded-tile overflow-hidden sc-coral relative"><span class="select-ring-off rounded-full absolute top-2 left-2"></span></div>
      <div class="aspect-square rounded-tile overflow-hidden sc-golden relative"><span class="select-ring-off rounded-full absolute top-2 left-2"></span></div>
      <div class="aspect-square rounded-tile overflow-hidden sc-dusk relative"><span class="select-ring-off rounded-full absolute top-2 left-2"></span></div>
    </main>

    <!-- Floating strong-glass selection action bar -->
    <!-- COMPONENT: modal-floating-bar -->
    <nav aria-label="Ações de seleção" data-component-id="modal-floating-bar" data-component-type="modal" data-component-variant="standard" class="strong-glass-bar fixed rounded-bar grid grid-cols-2 items-center z-20">
      <button type="button" class="h-full flex flex-col items-center justify-center gap-1 text-on-surface hover:bg-white/5 rounded-l-bar">
        <span class="material-symbols-outlined text-[24px]" aria-hidden="true">favorite</span>
        <span class="bar-label-xs font-label" data-design-text-token="label-md">Favoritar</span>
      </button>
      <button type="button" class="h-full flex flex-col items-center justify-center gap-1 text-danger hover:bg-white/5 rounded-r-bar">
        <span class="material-symbols-outlined text-[24px]" aria-hidden="true">delete</span>
        <span class="bar-label-xs font-label" data-design-text-token="label-md">Excluir</span>
      </button>
    </nav>
  </div>


</body></html>

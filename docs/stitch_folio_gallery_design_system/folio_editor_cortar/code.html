  </head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen pt-safe pb-safe"><main class="flex flex-col relative w-full bg-surface min-h-screen"><div class="flex flex-col w-full select-none overflow-hidden">
<!-- Top Bar -->
<header class="h-16 px-space-md flex items-center justify-between z-20">
<!-- Close Action -->
<button aria-label="Cancelar edição" class="w-11 h-11 rounded-full flex items-center justify-center text-on-surface active:bg-surface-container transition-colors" type="button">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<!-- Title -->
<h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight">Editar</h1>
<!-- Right Actions -->
<div class="flex items-center gap-space-sm">
<button class="h-11 px-3.5 rounded-xl bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm active:bg-surface-container-highest transition-colors" type="button">
        Restaurar
      </button>
<button class="h-11 px-5 rounded-full bg-primary-container text-on-primary font-title-sm text-label-md shadow-sm active:opacity-90 active:scale-95 transition-all" type="button">
        Salvar
      </button>
</div>
</header>
<!-- Photo Stage (Crop Viewport) -->
<section class="relative w-full h-[370px] bg-surface-container-lowest flex items-center justify-center p-space-md overflow-hidden">
<!-- Dusk City Skyline Container -->
<div class="relative w-[248px] h-[310px] rounded-lg shadow-2xl flex items-center justify-center overflow-hidden">
<!-- Image Layer -->
<img class="w-full h-full object-cover rounded-lg" data-alt="Dusk cityscape with illuminated skyscrapers, warm glowing windows, twilight purple and deep midnight blue gradient sky, a thin ethereal crescent moon, cinematic urban composition with rich textures, clean shadows, atmospheric haze, fine art photography style" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBci6wmdv-xYxNssAKW56zMp8sftk92MH3fKFP_fzcVii2HkFjS2RTMaosPACXqUAj8oLlWjizcph7FOd8cnVvqPoT8dFALzuzDIhVe1WZOhDJIPGjhXYCVrKGsOh6ZDnvf03DelTShOzCllN5FbOxtH3IljmwzsOrJSh8qfv6wiA2luuusW2T7MwX_4FTCOB_cp-OSYVSqodXe47sPKXZ4tZNtlXNiTBj3VGV975Q"/>
<!-- Subtle Scrim Dimming Mask -->
<div class="absolute inset-0 bg-surface-dim/20 pointer-events-none"></div>
<!-- Rule-of-Thirds Cropping Grid (4:5 Ratio) -->
<div class="absolute inset-0 pointer-events-none grid grid-cols-3 grid-rows-3">
<!-- Grid horizontal & vertical lines crafted with soft opacity -->
<div class="border-b border-r border-on-surface/25"></div>
<div class="border-b border-r border-on-surface/25"></div>
<div class="border-b border-on-surface/25"></div>
<div class="border-b border-r border-on-surface/25"></div>
<div class="border-b border-r border-on-surface/25"></div>
<div class="border-b border-on-surface/25"></div>
<div class="border-r border-on-surface/25"></div>
<div class="border-r border-on-surface/25"></div>
<div></div>
</div>
<!-- Crop Corner Handles -->
<!-- Top-Left -->
<div class="absolute top-1 left-1 w-4 h-4 pointer-events-none flex flex-col justify-start">
<div class="w-full h-[3px] bg-primary rounded-full"></div>
<div class="w-[3px] h-3 bg-primary rounded-full -mt-[3px]"></div>
</div>
<!-- Top-Right -->
<div class="absolute top-1 right-1 w-4 h-4 pointer-events-none flex flex-col items-end">
<div class="w-full h-[3px] bg-primary rounded-full"></div>
<div class="w-[3px] h-3 bg-primary rounded-full -mt-[3px]"></div>
</div>
<!-- Bottom-Left -->
<div class="absolute bottom-1 left-1 w-4 h-4 pointer-events-none flex flex-col justify-end">
<div class="w-[3px] h-3 bg-primary rounded-full"></div>
<div class="w-full h-[3px] bg-primary rounded-full"></div>
</div>
<!-- Bottom-Right -->
<div class="absolute bottom-1 right-1 w-4 h-4 pointer-events-none flex flex-col items-end justify-end">
<div class="w-[3px] h-3 bg-primary rounded-full"></div>
<div class="w-full h-[3px] bg-primary rounded-full"></div>
</div>
<!-- Subtle Center Crosshair Indicator -->
<div class="absolute w-2 h-2 pointer-events-none flex items-center justify-center">
<div class="w-full h-[1px] bg-primary/70"></div>
<div class="h-full w-[1px] bg-primary/70 absolute"></div>
</div>
</div>
</section>
<!-- Tool Panel -->
<section class="w-full px-space-md pt-3 pb-2 flex flex-col justify-between gap-3 bg-surface z-10">
<!-- Row 1: Aspect Ratio Horizontal Chips -->
<div aria-label="Proporções de tela" class="flex items-center gap-space-sm overflow-x-auto no-scrollbar py-0.5" role="tablist">
<!-- Original -->
<button class="shrink-0 h-11 px-4 rounded-xl bg-surface-container-high text-on-surface font-label-md text-label-md flex items-center justify-center active:scale-95 transition-all" type="button">
        Original
      </button>
<!-- 1:1 -->
<button class="shrink-0 h-11 px-4 rounded-xl bg-surface-container-high text-on-surface font-label-md text-label-md flex items-center justify-center active:scale-95 transition-all" type="button">
        1:1
      </button>
<!-- 4:5 Selected -->
<button aria-selected="true" class="shrink-0 h-11 px-4 rounded-xl bg-secondary-container text-secondary font-headline-sm text-label-md flex items-center gap-1.5 shadow-sm transition-all" type="button">
<span class="material-symbols-outlined text-[16px] text-secondary">check</span>
<span>4:5</span>
</button>
<!-- 3:4 -->
<button class="shrink-0 h-11 px-4 rounded-xl bg-surface-container-high text-on-surface font-label-md text-label-md flex items-center justify-center active:scale-95 transition-all" type="button">
        3:4
      </button>
<!-- 16:9 -->
<button class="shrink-0 h-11 px-4 rounded-xl bg-surface-container-high text-on-surface font-label-md text-label-md flex items-center justify-center active:scale-95 transition-all" type="button">
        16:9
      </button>
<!-- 9:16 -->
<button class="shrink-0 h-11 px-4 rounded-xl bg-surface-container-high text-on-surface font-label-md text-label-md flex items-center justify-center active:scale-95 transition-all" type="button">
        9:16
      </button>
</div>
<!-- Row 2: Transform Actions -->
<div class="grid grid-cols-3 gap-space-sm pt-0.5">
<button class="h-10 rounded-xl bg-surface-container-high text-on-surface flex items-center justify-center gap-1.5 active:bg-surface-container-highest transition-colors" type="button">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant">rotate_left</span>
<span class="font-label-sm text-label-sm">Esquerda</span>
</button>
<button class="h-10 rounded-xl bg-surface-container-high text-on-surface flex items-center justify-center gap-1.5 active:bg-surface-container-highest transition-colors" type="button">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant">rotate_right</span>
<span class="font-label-sm text-label-sm">Direita</span>
</button>
<button class="h-10 rounded-xl bg-surface-container-high text-on-surface flex items-center justify-center gap-1.5 active:bg-surface-container-highest transition-colors" type="button">
<span class="material-symbols-outlined text-[20px] text-on-surface-variant">flip</span>
<span class="font-label-sm text-label-sm">Espelhar</span>
</button>
</div>
<!-- Microcopy Help String -->
<div class="flex items-center justify-center gap-1 pt-0.5 pb-1">
<span class="material-symbols-outlined text-[14px] text-on-surface-variant">info</span>
<p class="font-label-sm text-label-sm text-on-surface-variant text-center">
        O corte é centralizado na imagem.
      </p>
</div>
</section>
<!-- Bottom Navigation Tab Bar -->
<nav aria-label="Categorias de ferramentas" class="h-[72px] grid grid-cols-5 bg-surface-container-low px-1 z-20">
<!-- Cortar (Active) -->
<button class="flex flex-col items-center justify-center gap-1 text-primary-container transition-colors" type="button">
<span class="material-symbols-outlined text-[22px]">crop</span>
<span class="font-label-sm text-label-sm font-semibold">Cortar</span>

<!-- Filtros -->

<span class="font-label-sm text-label-sm">Filtros</span>
</button>
<!-- Ajustes -->
<button class="flex flex-col items-center justify-center gap-1 text-on-surface-variant active:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[22px]">tune</span>
<span class="font-label-sm text-label-sm">Ajustes</span>
</button>
<!-- Desenhar -->
<button class="flex flex-col items-center justify-center gap-1 text-on-surface-variant active:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[22px]">brush</span>
<span class="font-label-sm text-label-sm">Desenhar</span>
</button>
<!-- Texto -->
<button class="flex flex-col items-center justify-center gap-1 text-on-surface-variant active:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[22px]">title</span>
<span class="font-label-sm text-label-sm">Texto</span>
</button>
</nav>
</div></main></body></html>

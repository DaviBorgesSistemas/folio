<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, height=844, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Folio — Splash</title>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #07070A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #E3E1E9;
      overflow: hidden;
    }

    /* Mobile Canvas Container (390 x 844) */
    .mobile-frame {
      position: relative;
      width: 390px;
      height: 844px;
      background-color: #121318;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 24px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08);
      border-radius: 44px;
    }

    /* Ambient Soft Glows (Design System Exact Specs) */
    .glow-top-left {
      position: absolute;
      top: -100px;
      left: -80px;
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(122, 128, 255, 0.34) 0%, rgba(122, 128, 255, 0) 70%);
      filter: blur(55px);
      pointer-events: none;
      z-index: 1;
    }

    .glow-right {
      position: absolute;
      top: 24%;
      right: -100px;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(255, 128, 190, 0.20) 0%, rgba(255, 128, 190, 0) 70%);
      filter: blur(60px);
      pointer-events: none;
      z-index: 1;
    }

    .glow-bottom-left {
      position: absolute;
      bottom: -60px;
      left: -60px;
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(60, 200, 210, 0.20) 0%, rgba(60, 200, 210, 0) 70%);
      filter: blur(55px);
      pointer-events: none;
      z-index: 1;
    }

    /* Glass Tile Container for the Logo */
    .glass-logo-tile {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 36px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.05) 100%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(24px) saturate(1.5);
      -webkit-backdrop-filter: blur(24px) saturate(1.5);
      box-shadow: 0 18px 50px rgba(122, 128, 255, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      animation: logoScaleIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Top edge inner highlight specification */
    .glass-logo-tile::before {
      content: '';
      position: absolute;
      top: 0;
      left: 18px;
      right: 18px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      pointer-events: none;
    }

    /* Logo Visual Fan Inside */
    .mark-fan-container {
      position: relative;
      width: 106px;
      height: 106px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    /* Animations */
    @keyframes logoScaleIn {
      0% {
        opacity: 0;
        transform: scale(0.72);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fadeUpWordmark {
      0% {
        opacity: 0;
        transform: translateY(12px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeUpTagline {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes dotPulse {
      0%, 100% {
        background-color: #2C2C32;
        transform: scale(1);
        box-shadow: none;
      }
      50% {
        background-color: #BFC2FF;
        transform: scale(1.18);
        box-shadow: 0 0 8px rgba(191, 194, 255, 0.6);
      }
    }

    .anim-wordmark {
      animation: fadeUpWordmark 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
      opacity: 0;
    }

    .anim-tagline {
      animation: fadeUpTagline 0.75s cubic-bezier(0.16, 1, 0.3, 1) 0.45s forwards;
      opacity: 0;
    }

    /* Quiet Loading Dots */
    .loading-dot {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background-color: #2C2C32;
      transition: all 0.3s ease;
    }

    .dot-1 {
      animation: dotPulse 1.8s infinite ease-in-out 0s;
    }

    .dot-2 {
      animation: dotPulse 1.8s infinite ease-in-out 0.35s;
      background-color: #BFC2FF;
      box-shadow: 0 0 8px rgba(191, 194, 255, 0.4);
    }

    .dot-3 {
      animation: dotPulse 1.8s infinite ease-in-out 0.7s;
    }

    /* Reduced Motion Accessibility */
    @media (prefers-reduced-motion: reduce) {
      .glass-logo-tile,
      .anim-wordmark,
      .anim-tagline,
      .dot-1,
      .dot-2,
      .dot-3 {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .dot-2 {
        background-color: #BFC2FF !important;
      }
    }

    /* Hardware Acceleration & Smooth Rendering */
    .smooth-render {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
</head>
<body class="smooth-render">

  <main class="mobile-frame cursor-pointer" role="region" aria-label="Folio Splash Screen" id="splashScreen">
    
    <!-- Background Gradient Glows -->
    <div class="glow-top-left" aria-hidden="true"></div>
    <div class="glow-right" aria-hidden="true"></div>
    <div class="glow-bottom-left" aria-hidden="true"></div>

    <!-- Center Content Block -->
    <div class="flex flex-col items-center justify-center z-10 w-full text-center">
      
      <!-- 1. Glass App Tile holding the Folio Mark -->
      <div class="glass-logo-tile">
        <div class="mark-fan-container">
          <svg width="102" height="102" viewBox="0 0 102 102" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <!-- Drop shadow for the front primary card -->
              <filter id="frontCardGlow" x="12" y="10" width="76" height="82" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
                <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7A80FF" flood-opacity="0.38"/>
              </filter>
              <!-- Sun Gradient: Coral to Peach -->
              <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FF9385" />
                <stop offset="100%" stop-color="#FFBD92" />
              </linearGradient>
              <!-- Front Card Background Gradient: Pale white-lavender -->
              <linearGradient id="frontCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#F7F7FF" />
                <stop offset="100%" stop-color="#D4D7FF" />
              </linearGradient>
              <!-- Card Clip Path for the Landscape Illustration -->
              <clipPath id="frontCardClip">
                <rect x="25" y="19" width="52" height="64" rx="14" />
              </clipPath>
            </defs>

            <!-- Card 1: Back Left Card (Tilted -16deg around center 51,51) -->
            <g transform="rotate(-16, 51, 51)">
              <rect x="25" y="19" width="52" height="64" rx="14" fill="#BFC2FF" fill-opacity="0.30" stroke="rgba(255,255,255,0.22)" stroke-width="0.8" />
            </g>

            <!-- Card 2: Middle Right Card (Tilted +11deg around center 51,51) -->
            <g transform="rotate(11, 51, 51)">
              <rect x="25" y="19" width="52" height="64" rx="14" fill="#BFC2FF" fill-opacity="0.55" stroke="rgba(255,255,255,0.28)" stroke-width="0.8" />
            </g>

            <!-- Card 3: Front Card (Upright, minimal landscape photo) with violet glow shadow -->
            <g filter="url(#frontCardGlow)">
              <!-- Card Body -->
              <rect x="25" y="19" width="52" height="64" rx="14" fill="url(#frontCardBg)" />
              
              <!-- Artwork Clipped Inside Front Photo Card -->
              <g clip-path="url(#frontCardClip)">
                <!-- Sky Base subtle tint -->
                <rect x="25" y="19" width="52" height="64" fill="#E8EBFF" />

                <!-- Small Coral-to-Peach Sun at top right -->
                <circle cx="63" cy="33" r="5.5" fill="url(#sunGrad)" />

                <!-- Lighter Violet Mountain Range (#9AA0FF) -->
                <path d="M22 65 L37 46 L51 61 L62 49 L79 67 L79 85 L22 85 Z" fill="#9AA0FF" />

                <!-- Darker Navy-Indigo Range (#272A78) in front -->
                <path d="M22 71 L32 59 L44 70 L58 53 L79 73 L79 85 L22 85 Z" fill="#272A78" />

                <!-- Subtle lake/ground reflection line -->
                <rect x="25" y="78" width="52" height="6" fill="#1C1E5C" opacity="0.6" />
              </g>
              <!-- Card Border Highlight -->
              <rect x="25" y="19" width="52" height="64" rx="14" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" fill="none" />
            </g>
          </svg>
        </div>
      </div>

      <!-- 2. Wordmark (20px below) -->
      <h1 class="anim-wordmark mt-[20px] text-[38px] font-[800] leading-none tracking-[-0.04em] text-[#E3E1E9]">
        Folio
      </h1>

      <!-- 3. Tagline (12px below) -->
      <p class="anim-tagline mt-[12px] text-[15px] font-[400] leading-snug tracking-[-0.01em] text-[#C5C5D0]">
        Sua galeria, organizada
      </p>

    </div>

    <!-- 4. Bottom Quiet Loading Indicator: 56px above bottom edge -->
    <div class="absolute bottom-[56px] flex items-center justify-center gap-[8px] z-10" aria-label="Carregando">
      <div class="loading-dot dot-1"></div>
      <div class="loading-dot dot-2"></div>
      <div class="loading-dot dot-3"></div>
    </div>

  </main>

  <!-- Interactive click/tap behavior simulating transition -->
  <script>
    const splash = document.getElementById('splashScreen');
    if (splash) {
      splash.addEventListener('click', () => {
        splash.style.transition = 'opacity 0.4s ease';
        splash.style.opacity = '0.9';
        setTimeout(() => {
          splash.style.opacity = '1';
        }, 300);
      });
    }
  </script>
</body>
</html>

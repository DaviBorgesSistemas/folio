<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>

d", "on-tertiary-fixed-variant": "#6c3832", "inverse-on-surface": "#2f3036" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin": "0.875rem", "gutter": "0.25rem", "space-xs": "0.25rem", "space-sm": "0.5rem", "space-md": "0.875rem", "space-lg": "1rem", "space-xl": "1.5rem" }, fontFamily: { "headline-sm": ["Plus Jakarta Sans"], "label-md": ["Plus Jakarta Sans"], "label-sm": ["Plus Jakarta Sans"], "title-sm": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"], "title-md": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"] }, fontSize: { "headline-sm": ["20px", { lineHeight: "26px", letterSpacing: "0em", fontWeight: "700" }], "label-md": ["14px", { lineHeight: "18px", letterSpacing: "0.01em", fontWeight: "600" }], "label-sm": ["13px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "500" }], "title-sm": ["16px", { lineHeight: "22px", letterSpacing: "0em", fontWeight: "700" }], "body-md": ["15px", { lineHeight: "22px", letterSpacing: "0.01em", fontWeight: "400" }], "body-lg": ["16px", { lineHeight: "24px", letterSpacing: "0.01em", fontWeight: "400" }], "display-lg": ["64px", { lineHeight: "72px", letterSpacing: "-0.02em", fontWeight: "800" }], "headline-md": ["22px", { lineHeight: "28px", letterSpacing: "-0.01em", fontWeight: "800" }], "body-sm": ["14px", { lineHeight: "20px", letterSpacing: "0.01em", fontWeight: "400" }], "title-md": ["17px", { lineHeight: "24px", letterSpacing: "0em", fontWeight: "700" }], "headline-lg": ["34px", { lineHeight: "42px", letterSpacing: "-0.02em", fontWeight: "800" }] } } } }</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen pt-safe pb-safe"><main class="flex flex-col relative w-full bg-surface min-h-screen"><div class="flex flex-col w-full select-none" id="editor-screen">
<!-- Top Bar -->
<header class="h-16 px-space-md flex items-center justify-between bg-surface z-20 shrink-0">
<button aria-label="Fechar" class="w-11 h-11 rounded-full flex items-center justify-center text-on-surface hover:bg-surface-container active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[22px]">close</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface">Editar</h1>
<div class="flex items-center gap-space-xs">
<button class="h-11 px-space-md rounded-xl bg-surface-container-high text-on-surface-variant font-label-md text-label-md active:scale-95 transition-all" type="button">
        Restaurar
      </button>
<button class="h-11 px-space-lg rounded-full bg-primary-container text-on-primary font-title-sm text-title-sm shadow-md active:scale-95 transition-all" type="button">
        Salvar
      </button>
</div>
</header>
<!-- Canvas Stage -->
<section class="relative bg-surface-container-lowest flex items-center justify-center p-space-md overflow-hidden" style="min-height: 380px;">
<!-- Photo Container -->
<div class="relative w-full max-w-[358px] aspect-[4/5] rounded-[6px] overflow-hidden shadow-2xl flex items-center justify-center">
<img class="absolute inset-0 w-full h-full object-cover pointer-events-none" data-alt="Cinematic dusk city skyline at twilight with lit skyscraper windows under a deep ultramarine night sky, faint soft crescent moon glowing gently, subtle purple and warm amber reflections, clean architectural lines and atmospheric nocturnal mood." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCGfWRKVREkjk0QfSoElkRb6kQZBZgkf9aCYkkwC7p4vF8nB6WCYUN74bEzwc15AQya3LZ5VsNle7YXBYXi3H01frcTr-7xDgGspjqzWrNNDZroPEmyn-8vzmRLsbV9MZ2jl4dXu3Im6dTneH4fpidF4t4pp_0cZndV-dPtu6vYFmHcbM85FJ6cqD_aTCQufz74W1EtoTAoBcbh11vGQd6cMW2Mh6CnkJLAG5ziqj8"/>
<!-- Text Layer & Selection Bounds -->
<div class="relative z-10 px-4 py-2 cursor-move group transition-transform" id="canvas-text-wrapper">
<!-- Dashed Selection Box -->
<div class="absolute inset-0 border border-dashed border-surface-tint rounded-sm pointer-events-none">
<!-- 4 Corner Handles -->
<span class="absolute -top-1.5 -left-1.5 w-3 h-3 bg-surface-tint rounded-full shadow-sm"></span>
<span class="absolute -top-1.5 -right-1.5 w-3 h-3 bg-surface-tint rounded-full shadow-sm"></span>
<span class="absolute -bottom-1.5 -left-1.5 w-3 h-3 bg-surface-tint rounded-full shadow-sm"></span>
<span class="absolute -bottom-1.5 -right-1.5 w-3 h-3 bg-surface-tint rounded-full shadow-sm"></span>
</div>
<!-- Rendered Text -->
<span class="font-headline-lg text-headline-lg text-on-surface font-extrabold tracking-tight drop-shadow-[0_4px_12px_rgba(0,0,0,0.85)] select-none" id="canvas-text">
          Boa noite
        </span>
</div>
</div>
</section>
<!-- Tool Panel -->
<section class="bg-surface px-space-md py-space-sm flex flex-col justify-between gap-space-sm shrink-0 border-t border-outline-variant/30">
<!-- Row 1: Text Input & Add Chip -->
<div class="flex items-center gap-space-sm">
<div class="flex-1 h-11 rounded-xl bg-surface-container-high px-space-md flex items-center shadow-inner">
<input class="w-full bg-transparent text-on-surface font-body-md text-body-md outline-none placeholder:text-outline" id="text-input-field" placeholder="Digite o texto" type="text" value="Boa noite"/>
</div>
<button class="h-11 px-space-lg rounded-xl bg-primary-container text-on-primary font-label-md text-label-md active:scale-95 transition-transform flex items-center justify-center shadow-sm" id="add-text-btn" type="button">
        Adicionar
      </button>
</div>
<!-- Row 2: Swatches & Trash -->
<div class="flex items-center justify-between pt-space-xs">
<div class="flex items-center gap-2 overflow-x-auto py-1">
<!-- Swatch #FFFFFF (Active) -->
<button aria-label="Branco" class="color-swatch w-7 h-7 rounded-full bg-white flex items-center justify-center ring-2 ring-primary-container ring-offset-2 ring-offset-surface transition-transform scale-110 active:scale-95" data-color="#FFFFFF" type="button">
<span class="w-2 h-2 rounded-full bg-surface-dim"></span>
</button>
<!-- Swatch #111111 -->
<button aria-label="Preto" class="color-swatch w-7 h-7 rounded-full bg-[#111111] border border-outline-variant flex items-center justify-center transition-transform active:scale-95" data-color="#111111" type="button"></button>
<!-- Swatch #FF5A5F -->
<button aria-label="Vermelho" class="color-swatch w-7 h-7 rounded-full bg-[#FF5A5F] flex items-center justify-center transition-transform active:scale-95" data-color="#FF5A5F" type="button"></button>
<!-- Swatch #FFC145 -->
<button aria-label="Amarelo" class="color-swatch w-7 h-7 rounded-full bg-[#FFC145] flex items-center justify-center transition-transform active:scale-95" data-color="#FFC145" type="button"></button>
<!-- Swatch #BFC2FF -->
<button aria-label="Lilás" class="color-swatch w-7 h-7 rounded-full bg-primary-container flex items-center justify-center transition-transform active:scale-95" data-color="#BFC2FF" type="button"></button>
<!-- Swatch #4C8DFF -->
<button aria-label="Azul" class="color-swatch w-7 h-7 rounded-full bg-[#4C8DFF] flex items-center justify-center transition-transform active:scale-95" data-color="#4C8DFF" type="button"></button>
<!-- Swatch #C86BFA -->
<button aria-label="Magenta" class="color-swatch w-7 h-7 rounded-full bg-[#C86BFA] flex items-center justify-center transition-transform active:scale-95" data-color="#C86BFA" type="button"></button>
</div>
<!-- Remove Layer Action -->
<button aria-label="Excluir texto" class="w-9 h-9 rounded-full bg-error-container/30 text-error flex items-center justify-center shrink-0 active:scale-90 transition-transform" id="delete-text-btn" type="button">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button>
</div>
<!-- Row 3: Font Size Slider -->
<div class="flex items-center gap-space-sm pt-space-xs">
<span class="font-label-sm text-label-sm text-on-surface-variant shrink-0">Tamanho</span>
<div class="relative flex-1 flex items-center h-8">
<input class="w-full h-1.5 bg-surface-container-highest rounded-full appearance-none accent-primary cursor-pointer outline-none" id="font-size-slider" max="48" min="18" type="range" value="34"/>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant w-7 text-right" id="font-size-indicator">34</span>
</div>
</section>
<!-- Bottom Navigation / Tool Tabs -->
<nav class="h-[72px] bg-surface grid grid-cols-5 border-t border-outline-variant/30 shrink-0">
<!-- Cortar -->
<button class="flex flex-col items-center justify-center gap-1 text-on-surface-variant active:opacity-75 transition-opacity" type="button">
<span class="material-symbols-outlined text-[22px]">crop</span>
<span class="font-label-sm text-[12px] font-medium leading-none">Cortar</span>
</button>
<!-- Filtros -->
<button class="flex flex-col items-center justify-center gap-1 text-on-surface-variant active:opacity-75 transition-opacity" type="button">
<span class="material-symbols-outlined text-[22px]">photo_filter</span>
<span class="font-label-sm text-[12px] font-medium leading-none">Filtros</span>
</button>
<!-- Ajustes -->
<button class="flex flex-col items-center justify-center gap-1 text-on-surface-variant active:opacity-75 transition-opacity" type="button">
<span class="material-symbols-outlined text-[22px]">tune</span>
<span class="font-label-sm text-[12px] font-medium leading-none">Ajustes</span>
</button>
<!-- Desenhar -->
<button class="flex flex-col items-center justify-center gap-1 text-on-surface-variant active:opacity-75 transition-opacity" type="button">
<span class="material-symbols-outlined text-[22px]">draw</span>
<span class="font-label-sm text-[12px] font-medium leading-none">Desenhar</span>
</button>
<!-- Texto (Active) -->
<button class="flex flex-col items-center justify-center gap-1 text-primary-fixed-dim relative" type="button">
<span class="material-symbols-outlined text-[22px]">title</span>
<span class="font-label-sm text-[12px] font-semibold leading-none text-primary-fixed-dim">Texto</span>
<span class="w-1 h-1 bg-primary-fixed-dim rounded-full absolute bottom-1.5"></span>
</button>
</nav>
</div>
<script>
  (function () {
    const textInput = document.getElementById('text-input-field');
    const canvasText = document.getElementById('canvas-text');
    const slider = document.getElementById('font-size-slider');
    const sizeIndicator = document.getElementById('font-size-indicator');
    const swatches = document.querySelectorAll('.color-swatch');
    const textWrapper = document.getElementById('canvas-text-wrapper');
    const deleteBtn = document.getElementById('delete-text-btn');
    const addBtn = document.getElementById('add-text-btn');

    if (textInput && canvasText) {
      textInput.addEventListener('input', function (e) {
        canvasText.textContent = e.target.value.trim() || ' ';
      });
    }

    if (slider && canvasText && sizeIndicator) {
      slider.addEventListener('input', function (e) {
        const val = e.target.value;
        canvasText.style.fontSize = val + 'px';
        canvasText.style.lineHeight = (parseInt(val, 10) * 1.2) + 'px';
        sizeIndicator.textContent = val;
      });
    }

    swatches.forEach(function (swatch) {
      swatch.addEventListener('click', function () {
        swatches.forEach(function (s) {
          s.classList.remove('ring-2', 'ring-primary-container', 'ring-offset-2', 'ring-offset-surface', 'scale-110');
          const innerDot = s.querySelector('span');
          if (innerDot) innerDot.remove();
        });
        this.classList.add('ring-2', 'ring-primary-container', 'ring-offset-2', 'ring-offset-surface', 'scale-110');
        const color = this.getAttribute('data-color');
        if (canvasText) {
          canvasText.style.color = color;
        }
        const dot = document.createElement('span');
        dot.className = 'w-2 h-2 rounded-full ' + (color === '#FFFFFF' || color === '#FFC145' || color === '#BFC2FF' ? 'bg-surface-dim' : 'bg-white');
        this.appendChild(dot);
      });
    });

    if (deleteBtn && textWrapper) {
      deleteBtn.addEventListener('click', function () {
        textWrapper.style.display = 'none';
      });
    }

    if (addBtn && textWrapper) {
      addBtn.addEventListener('click', function () {
        textWrapper.style.display = 'block';
        if (textInput && textInput.value) {
          canvasText.textContent = textInput.value;
        }
      });
    }
  })();
</script></main></body></html>

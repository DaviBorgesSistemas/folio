<!-- Interactive Logic -->
<script>
    (() => {
      const previewImg = document.getElementById('main-preview');
      const badgeName = document.getElementById('badge-name');
      const filterButtons = document.querySelectorAll('.filter-btn');
      const btnRevert = document.getElementById('btn-revert');
      const btnSave = document.getElementById('btn-save');
      let currentFilter = 'none';

      // Preset selection
      filterButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          const filterValue = btn.dataset.filter;
          const nameValue = btn.dataset.name;
          currentFilter = filterValue;

          // Apply to preview
          previewImg.style.filter = filterValue;
          badgeName.textContent = nameValue;

          // Update Selection States
          filterButtons.forEach(b => {
            const box = b.querySelector('.filter-thumb-box');
            const label = b.querySelector('.filter-label');
            box.classList.remove('bg-primary');
            box.classList.add('bg-transparent');
            label.classList.remove('text-primary', 'font-semibold');
            label.classList.add('text-on-surface-variant');
          });

          const activeBox = btn.querySelector('.filter-thumb-box');
          const activeLabel = btn.querySelector('.filter-label');
          activeBox.classList.remove('bg-transparent');
          activeBox.classList.add('bg-primary');
          activeLabel.classList.add('text-primary', 'font-semibold');
          activeLabel.classList.remove('text-on-surface-variant');
        });
      });

      // Quick Revert to Original
      btnRevert?.addEventListener('click', () => {
        const originalBtn = filterButtons[0];
        if (originalBtn) originalBtn.click();
      });

      // Long-press preview to inspect original state
      let touchTimeout;
      const stage = previewImg.parentElement;

      const showOriginal = () => {
        previewImg.style.filter = 'none';
        badgeName.textContent = 'Comparando...';
      };

      const restoreCurrent = () => {
        previewImg.style.filter = currentFilter;
        const activeBtn = document.querySelector('.filter-thumb-box.bg-primary')?.closest('.filter-btn');
        if (activeBtn) badgeName.textContent = activeBtn.dataset.name;
      };

      stage?.addEventListener('mousedown', showOriginal);
      window.addEventListener('mouseup', restoreCurrent);
      stage?.addEventListener('touchstart', showOriginal, { passive: true });
      window.addEventListener('touchend', restoreCurrent);

      // Save confirmation micro-feedback
      btnSave?.addEventListener('click', () => {
        const origText = btnSave.innerHTML;
        btnSave.innerHTML = '<span class="material-symbols-outlined text-[18px]">check</span> Salvo!';
        btnSave.classList.add('bg-primary', 'text-on-primary');
        setTimeout(() => {
          btnSave.innerHTML = origText;
          btnSave.classList.remove('bg-primary', 'text-on-primary');
        }, 1400);
      });
    })();
  </script>
